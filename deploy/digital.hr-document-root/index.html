<!DOCTYPE html>
<!--
  digital.hr — document root (ravan s mapom vnlh/)
  Kopiraj cijelu datoteku na server kao index.html; robi.jpg mora biti u istom folderu.
  Slika: object-fit cover — puni ekran, bez bijelih traka.
-->
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>digital.hr</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
    }
    .wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="robi.jpg" alt="" decoding="async" fetchpriority="high">
  </div>
</body>
</html>
