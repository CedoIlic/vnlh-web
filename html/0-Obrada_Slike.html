<!-- Fragment modala za obradu slike. Učitava 0-Obrada_Slike.js; placeholder __ID_PREFIX__ zamjenjuje se s idPrefix iz init opcija. -->
<div id="__ID_PREFIX__" class="kontrola-modal kontrola-modal--dim" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="__ID_PREFIX___header">
    <div class="kontrola-modal__overlay"></div>
    <div class="kontrola-modal__dialog obrada-slika__dialog">
        <div class="kontrola-modal__header obrada-slika__header" id="__ID_PREFIX___header">
            <div class="obrada-slika__header-title" data-i18n="global.obrada_slike.naslov">Obrada slike</div>
            <div id="__ID_PREFIX___fileinfo" class="obrada-slika__header-fileinfo" aria-live="polite"></div>
            <div id="__ID_PREFIX___header_meta" class="obrada-slika__header-meta" aria-hidden="true">
                <span class="obrada-slika__header-meta-left"><span data-i18n="global.obrada_slike.tip">Tip:</span> <span id="__ID_PREFIX___tip"></span></span>
                <span class="obrada-slika__header-meta-right"><span data-i18n="global.obrada_slike.velicina">Veličina:</span> <span id="__ID_PREFIX___velicina"></span></span>
            </div>
        </div>
        <div class="kontrola-modal__body obrada-slika__body">
            <div class="kontrola-modal__content obrada-slika__content">
                <div id="__ID_PREFIX___sadrzaj" class="obrada-slika__sadrzaj">
                    <div id="__ID_PREFIX___preview_wrap" class="obrada-slika__preview-wrap">
                        <img id="__ID_PREFIX___img" src="" alt="Pregled slike" data-i18n-alt="global.obrada_slike.pregled_alt" class="obrada-slika__img">
                        <div id="__ID_PREFIX___selection_overlay" class="obrada-slika__selection-overlay" aria-hidden="true">
                            <div id="__ID_PREFIX___selection_dim_top" class="obrada-slika__selection-dim" aria-hidden="true"></div>
                            <div id="__ID_PREFIX___selection_dim_left" class="obrada-slika__selection-dim" aria-hidden="true"></div>
                            <div id="__ID_PREFIX___selection_dim_right" class="obrada-slika__selection-dim" aria-hidden="true"></div>
                            <div id="__ID_PREFIX___selection_dim_bottom" class="obrada-slika__selection-dim" aria-hidden="true"></div>
                            <div id="__ID_PREFIX___selection_box" class="obrada-slika__selection-box">
                                <span id="__ID_PREFIX___selection_resize" class="obrada-slika__selection-resize" aria-hidden="true"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="obrada-slika__toolbar" role="toolbar" aria-label="Alatna traka obrade slike" data-i18n-aria="global.obrada_slike.toolbar_aria">
                <input type="file" id="__ID_PREFIX___file" class="obrada-slika__file" accept="image/*" aria-hidden="true" tabindex="-1">
                <button type="button" id="__ID_PREFIX___ikona_ucitaj" class="obrada-slika__toolbar-btn" aria-label="Učitaj sliku" title="Učitaj sliku" data-i18n-aria="global.obrada_slike.ucitaj" data-i18n-title="global.obrada_slike.ucitaj">
                    <span class="kontrola-icon--arrow-up-tray" aria-hidden="true"></span>
                </button>
                <button type="button" id="__ID_PREFIX___ikona_selekcija" class="obrada-slika__toolbar-btn" aria-label="Odabir područja za izrez" title="Odabir područja za izrez" data-i18n-aria="global.obrada_slike.selekcija" data-i18n-title="global.obrada_slike.selekcija" disabled>
                    <span class="kontrola-icon--viewfinder-circle" aria-hidden="true"></span>
                </button>
                <button type="button" id="__ID_PREFIX___ikona_crop" class="obrada-slika__toolbar-btn" aria-label="Izreži odabrano područje" title="Izreži odabrano područje" data-i18n-aria="global.obrada_slike.crop" data-i18n-title="global.obrada_slike.crop">
                    <svg class="kontrola-icon obrada-slika__toolbar-svg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" d="m7.848 8.25 1.536.887M7.848 8.25a3 3 0 1 1-5.196-3 3 3 0 0 1 5.196 3Zm1.536.887a2.165 2.165 0 0 1 1.083 1.839c.005.351.054.695.14 1.024M9.384 9.137l2.077 1.199M7.848 15.75l1.536-.887m-1.536.887a3 3 0 1 1-5.196 3 3 3 0 0 1 5.196-3Zm1.536-.887a2.165 2.165 0 0 0 1.083-1.838c.005-.352.054-.695.14-1.025m-1.223 2.863 2.077-1.199m0-3.328a4.323 4.323 0 0 1 2.068-1.379l5.325-1.628a4.5 4.5 0 0 1 2.48-.044l.803.215-7.794 4.5m-2.882-1.664A4.33 4.33 0 0 0 10.607 12m3.736 0 7.794 4.5-.802.215a4.5 4.5 0 0 1-2.48-.043l-5.326-1.629a4.324 4.324 0 0 1-2.068-1.379M14.343 12l-2.882 1.664"/></svg>
                </button>
                <button type="button" id="__ID_PREFIX___ikona_undo" class="obrada-slika__toolbar-btn" aria-label="Vrati korak unatrag" title="Vrati korak unatrag" data-i18n-aria="global.obrada_slike.undo" data-i18n-title="global.obrada_slike.undo" disabled>
                    <svg class="kontrola-icon obrada-slika__toolbar-svg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"/></svg>
                </button>
                <button type="button" id="__ID_PREFIX___ikona_compress" class="obrada-slika__toolbar-btn" aria-label="Smanji veličinu datoteke" title="Smanji veličinu datoteke" data-i18n-aria="global.obrada_slike.compress" data-i18n-title="global.obrada_slike.compress">
                    <svg class="kontrola-icon obrada-slika__toolbar-svg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25"/></svg>
                </button>
                <button type="button" id="__ID_PREFIX___ikona_round" class="obrada-slika__toolbar-btn" aria-label="Kružni prikaz" title="Kružni prikaz" data-i18n-aria="global.obrada_slike.round" data-i18n-title="global.obrada_slike.round" disabled>
                    <!-- Heroicons outline user-circle -->
                    <svg class="kontrola-icon obrada-slika__toolbar-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke="currentColor" aria-hidden="true" width="24" height="24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.125A8.966 8.966 0 0 1 12 15.75c2.577 0 4.886 1.09 6.5 2.828" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3.75a8.25 8.25 0 1 0 0 16.5 8.25 8.25 0 0 0 0-16.5Z" />
                    </svg>
                </button>
                <button type="button" id="__ID_PREFIX___ikona_obrisi" class="obrada-slika__toolbar-btn obrada-slika__toolbar-btn--obrisi" aria-label="Obriši sliku iz okvira" title="Obriši sliku iz okvira" data-i18n-aria="global.obrada_slike.obrisi" data-i18n-title="global.obrada_slike.obrisi" disabled>
                    <span class="kontrola-icon--trash" aria-hidden="true"></span>
                </button>
            </div>
        </div>
        <div class="obrada-slika__ratio-row">
            <label class="kontrola-labela mb-0 obrada-slika__ratio-label" for="__ID_PREFIX___ratio_x" data-i18n="global.obrada_slike.omjer">Omjer</label>
            <input type="text" id="__ID_PREFIX___ratio_x" class="kontrola-edit obrada-slika__ratio-edit" inputmode="decimal" value="1" aria-label="Omjer x" data-i18n-aria="global.obrada_slike.omjer_x">
            <span class="obrada-slika__ratio-sep">:</span>
            <input type="text" id="__ID_PREFIX___ratio_y" class="kontrola-edit obrada-slika__ratio-edit" inputmode="decimal" value="1" aria-label="Omjer y" data-i18n-aria="global.obrada_slike.omjer_y">
        </div>
        <div class="kontrola-modal__footer">
            <button type="button" id="__ID_PREFIX___spremi" class="kontrola-btn obrada-slika__btn-spremi" data-obrada-slika="spremi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label" data-i18n="global.gumb.ok">OK</span></span></span></button>
            <button type="button" id="__ID_PREFIX___odustani" class="kontrola-btn"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label" data-i18n="global.gumb.odustani">Odustani</span></span></span></button>
        </div>
        <div id="__ID_PREFIX___resize_handle" class="obrada-slika__resize-handle" aria-label="Povuci za promjenu veličine" title="Promjena veličine" data-i18n-aria="global.obrada_slike.resize_aria" data-i18n-title="global.obrada_slike.resize_title">
            <svg class="obrada-slika__resize-handle-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </div>
    </div>
</div>
