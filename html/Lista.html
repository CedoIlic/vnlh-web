<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../slike/VNLH_Favicon.png?v=1.0.241" type="image/png" sizes="32x32">
  <title>Lista članova</title>
  <!-- 0-Kontrole: modal promjene verzije (00-Version.js), tipke .kontrola-btn, polja .kontrola-edit -->
  <link rel="stylesheet" href="../css/0-Common.css?v=1.0.241">
  <link rel="stylesheet" href="../css/0-Kontrole.css?v=1.0.241">
  <link rel="stylesheet" href="../css/0-Poruke.css?v=1.0.241">
  <link rel="stylesheet" href="../css/Lista.css?v=1.0.241">
</head>
<body class="vnlh-page-lista">
  <div class="naslov-forme"><h2>Lista članova</h2></div>
  <div class="page-container">
    <div class="lista-panel" id="listaPanel">
      <div class="lista-panel__header">
        <div class="lista-header__row lista-header__row--drzava">
          <label class="lista-labela" for="select_drzava">Država</label>
          <div class="lista-select">
            <select id="select_drzava" aria-label="Odaberi državu">
              <option value="">— Odaberi državu —</option>
            </select>
          </div>
          <!-- Na mobilnom (≤767px) osvježavanje ovdje desno od Države; na širem ekranu skriveno (vidi .lista-reload-btn--desktop-only). -->
          <button type="button" id="btn_lista_reload_mob" class="lista-reload-btn lista-reload-btn--mob-only" aria-label="Ponovno punjenje tablice" title="Puni tablicu" style="display:none"><span class="kontrola-icon--arrow-path" aria-hidden="true"></span></button>
        </div>
        <div class="lista-header__row lista-header__row--regija">
          <label class="lista-labela" for="select_regija">Regija</label>
          <div class="lista-select">
            <select id="select_regija" aria-label="Odaberi regiju" disabled>
              <option value="">— Odaberi regiju —</option>
            </select>
          </div>
          <!-- Na širem ekranu osvježavanje uz Regiju; na mobilnom skriveno (duplikat je uz Državu). -->
          <button type="button" id="btn_lista_reload" class="lista-reload-btn lista-reload-btn--desktop-only" aria-label="Ponovno punjenje tablice" title="Puni tablicu" style="display:none"><span class="kontrola-icon--arrow-path" aria-hidden="true"></span></button>
        </div>
        <div class="lista-header__row">
          <label class="lista-labela" for="select_loza">Loža</label>
          <div class="lista-select">
            <select id="select_loza" aria-label="Odaberi ložu" disabled>
              <option value="">— Odaberi ložu —</option>
            </select>
          </div>
        </div>
        <div class="lista-header__row lista-header__row--redaka-i-trazi">
          <label class="lista-labela" for="select_broj_redaka">Redaka</label>
          <div class="lista-select lista-select--sirina-redaka">
            <select id="select_broj_redaka" aria-label="Redaka po stranici">
              <option value="3">3</option>
              <option value="5">5</option>
              <option value="8">8</option>
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
          </div>
          <div class="kontrola-edit-delete lista-trazi-kontrola">
            <span class="lista-trazi-kontrola__ikon" aria-hidden="true"></span>
            <input id="edit_lista_trazi" type="text" class="kontrola-edit-delete__input" autocomplete="off" aria-label="Traži u listi članova" placeholder="Traži...">
            <button type="button" class="kontrola-edit-delete__clear" aria-label="Obriši sadržaj" title="Obriši"><span class="kontrola-icon--x-mark" aria-hidden="true"></span></button>
          </div>
        </div>
      </div>

      <div class="lista-panel__body">
        <div id="listaTablicaContainer" class="lista-tablica"></div>
      </div>

      <div class="lista-panel__footer lista-footer">
        <div class="lista-footer__left">
          <div class="lista-paginacija">
            <button type="button" id="btn_backward" class="lista-paginacija__btn" aria-label="Na početak" title="Na početak"><span class="lista-icon--backward" aria-hidden="true"></span></button>
            <button type="button" id="btn_prev" class="lista-paginacija__btn" aria-label="Stranica natrag" title="Stranica natrag"><span class="lista-icon--play-back" aria-hidden="true"></span></button>
            <span id="listaEdit" class="lista-paginacija__edit" aria-live="polite">1 / 1</span>
            <button type="button" id="btn_next" class="lista-paginacija__btn" aria-label="Stranica naprijed" title="Stranica naprijed"><span class="lista-icon--play" aria-hidden="true"></span></button>
            <button type="button" id="btn_forward" class="lista-paginacija__btn" aria-label="Na kraj" title="Na kraj"><span class="lista-icon--forward" aria-hidden="true"></span></button>
          </div>
        </div>
        <div class="lista-footer__row2">
          <span id="listaRedova" class="lista-paginacija__redova" aria-live="polite">Redova: 0</span>
          <div class="lista-footer__right">
            <button type="button" id="btnPovratak" class="lista-btn lista-btn--povratak" aria-label="Povratak na pozivnu formu"><span class="lista-btn__outer"><span class="lista-btn__inner"><span class="lista-btn__label">Povratak</span></span></span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/00-Version.js?v=1.0.241"></script>
  <script src="../js/0-Common.js?v=1.0.241"></script>
  <script src="../js/0-Filteri_Po_Ogranicenjima.js?v=1.0.241"></script>
  <script src="../js/0-Poruke.js?v=1.0.241"></script>
  <script src="../js/Lista.js?v=1.0.241"></script>
</body>
</html>
