<!-- =========================================================
     Zapisnik_CRUD.html
     Zapisnik – naslov, panel s vertikalnim resizeom, unutar panela tab kontrola.
     Skripte: 0-Kontrole.js, 0-Common.js, 0-Filteri_Po_Ogranicenjima.js, 0-Poruke_Tekstovi.js, 0-Kontrole_Tab.js, Zapisnik_CRUD.js
     Geo + logo u zaglavlju: isti arh. kao Clanovi_Loza_CRUD (Clanovi_Loza_CRUD.css, Loze_CRUD_slika).
     ========================================================= -->
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Zapisnik</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../slike/VNLH_Favicon.png?v=__VNLH_ASSET_V__" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../css/0-Common.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Kontrole_Tab.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/Clanovi_Loza_CRUD.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/Zapisnik_CRUD.css?v=__VNLH_ASSET_V__">
</head>
<body>
<div class="naslov-forme"><h2>Zapisnik</h2></div>
<div class="page-container zapisnik-crud__wrap">
    <!-- data-resize-min-px: postavlja Zapisnik_CRUD.js (proračun: zaglavlje + traka + tijelo max tabova + traka + podnožje). -->
    <!-- Samo visina: kontrola-panel--resize-y; traka u tijelu, initPanelResizeBar u 0-Kontrole.js -->
    <div class="kontrola-panel kontrola-panel--traka-desktop kontrola-panel--resize-y zapisnik-crud__panel mb-3" data-resize-max-vh="full" data-resize-min-px="400" id="zapisnikPanel">
        <!-- Logo + Država / Regija / Loža (kao zaglavlje tablice u Clanovi_Loza_CRUD; CSS: .clanovi-loza-crud__tablica-header-*). -->
        <div class="kontrola-panel__header clanovi-loza-crud__tablica-header zapisnik-crud__panel-header" role="group" aria-label="Zaglavlje zapisnika">
            <div class="clanovi-loza-crud__tablica-header-logo-wrap" aria-hidden="true">
                <div class="clanovi-loza-crud__tablica-header-logo-frame">
                    <img id="clanovi_loza_tablica_logo" class="clanovi-loza-crud__tablica-header-logo-img" alt="" decoding="async" hidden src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                </div>
            </div>
            <div class="clanovi-loza-crud__tablica-header-kontrole">
                <label class="kontrola-labela mb-0" for="select_drzava">Država</label>
                <div class="kontrola-select clanovi-loza-crud__header-select-drzava">
                    <select id="select_drzava" aria-label="Odaberi državu">
                        <option value="">— Odaberi državu —</option>
                    </select>
                </div>
                <label class="kontrola-labela mb-0" for="select_regija">Regija</label>
                <div class="kontrola-select">
                    <select id="select_regija" aria-label="Odaberi regiju" disabled>
                        <option value="">— Odaberi regiju —</option>
                    </select>
                </div>
                <label class="kontrola-labela mb-0" for="select_loza">Loža</label>
                <div class="kontrola-select">
                    <select id="select_loza" aria-label="Odaberi ložu" disabled>
                        <option value="">— Odaberi ložu —</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="kontrola-panel__body zapisnik-crud__panel-body">
            <div class="kontrola-tab kontrola-tab--kartice-sirina-proporcija zapisnik-crud__tab" id="zapisnikKontrolaTab" role="tablist" aria-label="Kartice zapisnika">
                <div class="kontrola-tab__traka" role="presentation">
                    <button type="button" class="kontrola-tab__kartica kontrola-tab__kartica--aktivna" role="tab" id="zapisnikKontrolaTabKart0" aria-selected="true" aria-controls="zapisnikKontrolaTabPanel0" data-tab-index="0">Podaci o radovima</button>
                    <button type="button" class="kontrola-tab__kartica" role="tab" id="zapisnikKontrolaTabKart1" aria-selected="false" aria-controls="zapisnikKontrolaTabPanel1" data-tab-index="1" tabindex="-1">Prisustvo</button>
                    <button type="button" class="kontrola-tab__kartica" role="tab" id="zapisnikKontrolaTabKart2" aria-selected="false" aria-controls="zapisnikKontrolaTabPanel2" data-tab-index="2" tabindex="-1">Dužnosnici</button>
                    <button type="button" class="kontrola-tab__kartica" role="tab" id="zapisnikKontrolaTabKart3" aria-selected="false" aria-controls="zapisnikKontrolaTabPanel3" data-tab-index="3" tabindex="-1">Zapisnik</button>
                </div>
                <div class="kontrola-tab__tijelo" role="presentation">
                    <div class="kontrola-tab__panel" role="tabpanel" id="zapisnikKontrolaTabPanel0" aria-labelledby="zapisnikKontrolaTabKart0">
                        <div class="kontrola-panel zapisnik-crud__podpanel-opci-radovi zapisnik-crud__podpanel--fiksna mb-0" id="zapisnikPodpanelOpiRadovi">
                            <div class="kontrola-panel__header zapisnik-crud__podpanel-opci-radovi-header">Opći podaci o radovima</div>
                            <div class="kontrola-panel__body zapisnik-crud__podpanel-opci-radovi-body">
                                <div class="zapisnik-crud__opci-radovi-wrap" role="group" aria-label="Datum, tip, stupanj i sudionici radova">
                                    <!-- r1c1: label iznad kontrole (lijevi stupac ~60%) -->
                                    <div class="zapisnik-crud__polje-stog zapisnik-crud__polje-datum" role="group" aria-label="Datum radova">
                                        <label class="kontrola-labela mb-0" for="zapisnik_datum_radova">Datum radova</label>
                                        <input id="zapisnik_datum_radova" type="date" class="kontrola-edit" aria-label="Datum radova">
                                    </div>
                                    <!-- r1c2: stupanj -->
                                    <div class="zapisnik-crud__polje-stog zapisnik-crud__polje-stupanj" role="group" aria-label="Stupanj radova">
                                        <label id="zapisnik_label_stupanj_radova" class="kontrola-labela mb-0" for="zapisnik_select_stupanj_radova">Stupanj radova</label>
                                        <div class="kontrola-select zapisnik-crud__select-stupanj-wrap">
                                            <select id="zapisnik_select_stupanj_radova" aria-label="Stupanj radova">
                                                <option value="">— Odaberi stupanj —</option>
                                            </select>
                                        </div>
                                    </div>
                                    <!-- r2c1: tip -->
                                    <div class="zapisnik-crud__polje-stog zapisnik-crud__polje-tip" role="group" aria-label="Tip radova">
                                        <div class="zapisnik-crud__polje-tip-gornji">
                                            <label class="kontrola-labela mb-0" for="zapisnik_select_tip_radova">Tip radova</label>
                                            <div class="kontrola-select zapisnik-crud__select-tip-wrap">
                                                <select id="zapisnik_select_tip_radova" aria-label="Tip radova">
                                                    <option value="">— Odaberi tip —</option>
                                                </select>
                                            </div>
                                        </div>
                                        <!-- Između gornjeg bloka i elipsa isti okomiti razmak kao row-gap mreže (0.75rem). -->
                                        <div class="zapisnik-crud__tip-ellipsis-red">
                                            <button type="button" id="zapisnik_btn_tip_ellipsis" class="zapisnik-crud__ellipsis-btn" aria-label="Više opcija tipa radova" title="Više opcija">
                                                <span class="kontrola-icon--ellipsis-horizontal" aria-hidden="true"></span>
                                            </button>
                                        </div>
                                    </div>
                                    <!-- r2c2: lože + napomena -->
                                    <div class="zapisnik-crud__polje-stog zapisnik-crud__polje-loze" role="group" aria-label="Lože koje su učestvovale">
                                        <label class="kontrola-labela mb-0" for="zapisnik_loza_ucesnici">Lože koje su učestvovale na radovima</label>
                                        <textarea id="zapisnik_loza_ucesnici" class="kontrola-napomena zapisnik-crud__textarea-loza" rows="3" spellcheck="true" aria-label="Lože koje su učestvovale na radovima"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Dvije kolone s okomitom graničnikom; čekboxi: JS zapisnikPostaviKontroleOvisnoLozi. -->
                        <div class="kontrola-panel zapisnik-crud__podpanel-ovjera zapisnik-crud__podpanel--fiksna zapisnik-crud__podpanel-ispod mb-0" id="zapisnikPodpanelOvjeraZapisnika" role="region" aria-labelledby="zapisnikPodpanelOvjeraZapisnikaHeader">
                            <div class="kontrola-panel__header zapisnik-crud__podpanel-ovjera-header" id="zapisnikPodpanelOvjeraZapisnikaHeader">Ovjera zapisnika</div>
                            <div class="kontrola-panel__body zapisnik-crud__podpanel-ovjera-body">
                                <div class="zapisnik-crud__ovjera-dvije-kolone" role="group" aria-label="Ovjera prije i nakon usvajanja na radovima">
                                    <div class="zapisnik-crud__ovjera-kol">
                                        <div class="zapisnik-crud__ovjera-kol-naslov">Ovjera prije usvajanja na radovima</div>
                                        <div class="zapisnik-crud__ovjera-cb-red">
                                            <input type="checkbox" id="zapisnik_cb_ovjera_prije_casni_majstor" class="kontrola-checkbox" value="1" aria-label="Časni majstor, ovjera prije usvajanja na radovima">
                                            <label class="kontrola-labela mb-0" for="zapisnik_cb_ovjera_prije_casni_majstor">Časni majstor</label>
                                        </div>
                                        <div class="zapisnik-crud__ovjera-cb-red">
                                            <input type="checkbox" id="zapisnik_cb_ovjera_prije_odg_inspektor" class="kontrola-checkbox" value="1" aria-label="Odgovorni inspektor, ovjera prije usvajanja na radovima">
                                            <label class="kontrola-labela mb-0" for="zapisnik_cb_ovjera_prije_odg_inspektor">Odgovorni Inspektor</label>
                                        </div>
                                    </div>
                                    <div class="zapisnik-crud__ovjera-kol zapisnik-crud__ovjera-kol--desno">
                                        <div class="zapisnik-crud__ovjera-kol-naslov">Ovjera nakon usvajanja na radovima</div>
                                        <div class="zapisnik-crud__ovjera-cb-red">
                                            <input type="checkbox" id="zapisnik_cb_ovjera_nakon_casni_majstor" class="kontrola-checkbox" value="1" aria-label="Časni majstor, ovjera nakon usvajanja na radovima">
                                            <label class="kontrola-labela mb-0" for="zapisnik_cb_ovjera_nakon_casni_majstor">Časni majstor</label>
                                        </div>
                                        <div class="zapisnik-crud__ovjera-cb-red">
                                            <input type="checkbox" id="zapisnik_cb_ovjera_nakon_tajnik" class="kontrola-checkbox" value="1" aria-label="Tajnik, ovjera nakon usvajanja na radovima">
                                            <label class="kontrola-labela mb-0" for="zapisnik_cb_ovjera_nakon_tajnik">Tajnik</label>
                                        </div>
                                        <div class="zapisnik-crud__ovjera-cb-red">
                                            <input type="checkbox" id="zapisnik_cb_ovjera_nakon_govornik" class="kontrola-checkbox" value="1" aria-label="Govornik, ovjera nakon usvajanja na radovima">
                                            <label class="kontrola-labela mb-0" for="zapisnik_cb_ovjera_nakon_govornik">Govornik</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="kontrola-tab__panel" role="tabpanel" id="zapisnikKontrolaTabPanel1" aria-labelledby="zapisnikKontrolaTabKart1" hidden>
                        <p class="mb-0 zapisnik-crud__uvod">Odjeljak Prisustvo.</p>
                    </div>
                    <div class="kontrola-tab__panel" role="tabpanel" id="zapisnikKontrolaTabPanel2" aria-labelledby="zapisnikKontrolaTabKart2" hidden>
                        <p class="mb-0 zapisnik-crud__uvod">Odjeljak Dužnosnici.</p>
                    </div>
                    <div class="kontrola-tab__panel" role="tabpanel" id="zapisnikKontrolaTabPanel3" aria-labelledby="zapisnikKontrolaTabKart3" hidden>
                        <p class="mb-0 zapisnik-crud__uvod">Odjeljak Zapisnik.</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="kontrola-panel__footer zapisnik-crud__edit-footer">
            <div class="zapisnik-crud__footer-left">
                <button type="button" id="btnUpisi" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upis</span></span></span></button>
                <button type="button" id="btnIzbrisi" class="kontrola-btn kontrola-btn--crud-izbrisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Izbriši</span></span></span></button>
            </div>
            <div class="zapisnik-crud__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
            </div>
        </div>
    </div>
</div>
<script src="../js/00-Version.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Kontrole.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Common.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Filteri_Po_Ogranicenjima.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke_Tekstovi.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Kontrole_Tab.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/Zapisnik_CRUD.js?v=__VNLH_ASSET_V__"></script>
</body>
</html>
