<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Tipovi Loža</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="../slike/VNLH_Favicon.png?v=10.16.00" type="image/png" sizes="32x32">
<link rel="stylesheet" href="../css/0-Common.css?v=10.16.00">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=10.16.00">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=10.16.00">
    <link rel="stylesheet" href="../css/00-Testni_modal.css?v=10.16.00">
    <link rel="stylesheet" href="../css/Loze_Tip_CRUD.css?v=10.16.00">
</head>
<body>
<div class="naslov-forme"><h2>Tipovi Loža</h2></div>
<div class="page-container">
    <div class="kontrola-panel-tablica kontrola-panel-tablica--has-header kontrola-panel kontrola-panel--resize-y mb-3">
        <div class="kontrola-panel__header loze-tip-crud__tablica-header" style="display: flex; align-items: center; gap: 0.75rem; min-width: 0;">
            <label class="kontrola-labela mb-0" for="select_obred_loze" style="white-space: nowrap; flex-shrink: 0;">Obred</label>
            <div class="kontrola-select" style="flex: 1 1 auto; min-width: 0;">
                <select id="select_obred_loze" aria-label="Obred pod kojim loža radi">
                    <option value="">Nije izabran</option>
                </select>
            </div>
        </div>
        <div class="kontrola-panel__body">
            <div id="tablicaContainer" class="kontrola-tablica"></div>
        </div>
    </div>
    <div class="kontrola-panel mb-3" id="edit_panel">
        <div class="kontrola-panel__body loze-tip-crud__edit-body">
            <div class="loze-tip-crud__edit-inner" style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.75rem;">
                    <div style="display: flex; flex-direction: column; gap: 0.25rem; flex: 1 1 0; min-width: 0;">
                        <label class="kontrola-labela mb-0" for="edit_naziv">Tip lože</label>
                        <div class="kontrola-edit-delete">
                            <input id="edit_naziv" type="text" class="kontrola-edit-delete__input" placeholder="Tip lože...">
                            <button type="button" class="kontrola-edit-delete__clear" aria-label="Obriši sadržaj">×</button>
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.25rem; flex: 0 0 auto; width: 5rem;">
                        <label class="kontrola-labela mb-0" for="edit_redosljed">Redosljed</label>
                        <input id="edit_redosljed" type="text" class="kontrola-edit" inputmode="numeric" placeholder="1–99" aria-label="Redosljed 1 do 99" style="text-align: right;">
                    </div>
                </div>
                <div style="display: flex; gap: 0.75rem;">
                    <div style="display: flex; flex-direction: column; gap: 0.25rem; flex: 1 1 0; min-width: 0;">
                        <label class="kontrola-labela mb-0" for="edit_stupnjevi_nadleznosti">Stupnjevi nadležnosti</label>
                        <input id="edit_stupnjevi_nadleznosti" type="text" class="kontrola-edit" readonly tabindex="-1" aria-readonly="true">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.25rem; flex: 1 1 0; min-width: 0;">
                        <label class="kontrola-labela mb-0" for="edit_stupnjevi_pregleda">Stupnjevi za pregled</label>
                        <input id="edit_stupnjevi_pregleda" type="text" class="kontrola-edit" readonly tabindex="-1" aria-readonly="true">
                    </div>
                </div>
            </div>
        </div>
        <div class="kontrola-panel__footer loze-tip-crud__edit-footer">
            <div class="loze-tip-crud__footer-left">
                <button type="button" id="btnUpisi" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upis</span></span></span></button>
                <button type="button" id="btnIzbrisi" class="kontrola-btn kontrola-btn--crud-izbrisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Izbriši</span></span></span></button>
            </div>
            <div class="loze-tip-crud__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
            </div>
        </div>
    </div>
</div>
<script src="../js/00-Version.js?v=10.16.00"></script>
<script src="../js/0-Kontrole.js?v=10.16.00"></script>
<script src="../js/0-Common.js?v=10.16.00"></script>
<script src="../js/00-Testni_modal.js?v=10.16.00"></script>
<script src="../js/0-Poruke.js?v=10.16.00"></script>
<script src="../js/0-Poruke_Tekstovi.js?v=10.16.00"></script>
<script src="../js/Loze_Tip_CRUD.js?v=10.16.00"></script>
</body>
</html>
