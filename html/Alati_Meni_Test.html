<!-- =========================================================
     Alati_Meni_Test.html
     Test menija – panel uvjeti s ID horizontalnog menija, podmenija, izvršnog menija.
     Horizontalna traka (#traka_h_menija, klase alati-meni-test__*) namjerno je ista komponenta kao u
     Meni.html — dijele se Alati_Meni_Test.css, te Meni.js / Alati_Meni_Test.js (isti ID-jevi u dokumentu).
     Ova stranica nije CRUD članova; ne miješati s html/Clanovi_CRUD.html (koji ne učitava ovaj CSS/JS).
     Skripte: 0-Kontrole.js, 0-Common.js, 0-Razine.js (select dužnosnika), Alati_Meni_Test.js
     ========================================================= -->
<!DOCTYPE html>
<html lang="hr">
<head>
    <!-- Master za hijerarhiju dužnosnika (0-Razine.js) i id korisnika za uvjet prikaza togglea „Svi“ (var. 1004 + 1002); PHP: Alati_Meni_Test.php -->
    <script>window.VNLH_OGRANICENJA_MASTER_ID=__VNLH_SESSION_MASTER_ID_DUZNOSNIK__;window.VNLH_ID_KORISNIK=__VNLH_ID_KORISNIK__;</script>
    <meta charset="UTF-8">
    <title>Test menija</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="icon" href="../slike/VNLH_Favicon.png?v=1.0.242" type="image/png" sizes="32x32">
<link rel="stylesheet" href="../css/0-Common.css?v=1.0.242">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=1.0.242">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=1.0.242">
    <link rel="stylesheet" href="../css/Alati_Meni_Test.css?v=1.0.242">
</head>
<body>

<div class="naslov-forme">
    <h2>Test menija</h2>
</div>

<div class="page-container">
    <div class="alati-meni-test__panels-row">
    <!-- Panel uvjeti (lijevo, pola širine) -->
    <div class="kontrola-panel mb-3 alati-meni-test__panel-uvjeti" id="panel_uvjeti">
        <div class="kontrola-panel__body alati-meni-test__body">
            <!-- Lijeva kolona: ID horizontalnog menija + ID izvršnog menija -->
            <div class="alati-meni-test__body-col alati-meni-test__body-col--left">
                <div class="alati-meni-test__grupa alati-meni-test__grupa--sustav-meni-tip">
                    <label class="kontrola-labela mb-0" for="edit_glavni_id">ID horizontalnog menija</label>
                    <div class="alati-meni-test__grupa-kontrole">
                        <input id="edit_glavni_id" type="text" class="kontrola-edit kontrola-edit--readonly alati-meni-test__edit-id" readonly tabindex="-1" aria-readonly="true">
                        <div class="kontrola-select">
                            <select id="select_meni_tip">
                                <option value="0">Nije izabran</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="alati-meni-test__grupa alati-meni-test__grupa--sustav-meni-tip">
                    <label class="kontrola-labela mb-0" for="edit_izvrsni_meni">ID izvršnog menija</label>
                    <div class="alati-meni-test__grupa-kontrole">
                        <input id="edit_izvrsni_meni" type="text" class="kontrola-edit kontrola-edit--readonly alati-meni-test__edit-id" readonly tabindex="-1" aria-readonly="true">
                        <!-- Select izvršnog menija + toggle „Svi“ (isti uvjet prikaza kao Ograničenja dužnosti: var. 1004=1 i korisnik u listi 1002); kontrolira punjenje select_duznosnik. -->
                        <div class="alati-meni-test__izvrsni-select-row">
                            <div class="kontrola-select alati-meni-test__izvrsni-select-grow">
                                <select id="select_izvrsni_meni">
                                    <option value="0">Nije izabran</option>
                                </select>
                            </div>
                            <div id="toggle_svi_duznosnik_meni_test_wrap" class="alati-meni-test__svi-toggle-wrap" hidden>
                                <label class="poruke__toggle-label" for="toggle_svi_duznosnik_meni_test">
                                    <input type="checkbox" id="toggle_svi_duznosnik_meni_test" class="poruke__toggle-input" autocomplete="off" disabled aria-label="Svi dužnosnici uključujući Mastera">
                                    <span class="poruke__toggle-slider" aria-hidden="true"></span>
                                    <span class="poruke__toggle-text">Svi</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Desna kolona: ID podmenija + Izbor dužnosnika -->
            <div class="alati-meni-test__body-col alati-meni-test__body-col--right">
                <div class="alati-meni-test__grupa alati-meni-test__grupa--sustav-meni-tip">
                    <label class="kontrola-labela mb-0" for="edit_podmeniji">ID podmenija</label>
                    <div class="alati-meni-test__grupa-kontrole">
                        <input id="edit_podmeniji" type="text" class="kontrola-edit kontrola-edit--readonly alati-meni-test__edit-id" readonly tabindex="-1" aria-readonly="true">
                        <div class="kontrola-select">
                            <select id="select_podmeniji">
                                <option value="0">Nije izabran</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="alati-meni-test__grupa">
                    <label class="kontrola-labela mb-0" for="select_duznosnik">Izbor dužnosnika</label>
                    <div class="kontrola-select alati-meni-test__select-duznosnik">
                        <select id="select_duznosnik">
                            <option value="0">Nije izabran</option>
                        </select>
                    </div>
                </div>
            </div>
            <!-- Ne korišteni moduli – ispod obje kolone -->
            <div class="alati-meni-test__grupa alati-meni-test__grupa--full">
                <label class="kontrola-labela mb-0" for="edit_napomena">Ne korišteni moduli</label>
                <div id="edit_napomena" class="kontrola-napomena kontrola-napomena--readonly alati-meni-test__napomena" role="textbox" tabindex="-1" aria-readonly="true"></div>
            </div>
            <!-- Spacer: raste s panelom, kontrole ostaju na mjestu -->
            <div class="alati-meni-test__body-spacer" aria-hidden="true"></div>
        </div>
        <div class="kontrola-panel__footer alati-meni-test__footer">
            <div class="alati-meni-test__footer-left">
                <button type="button" id="btnUpisi" class="kontrola-btn kontrola-btn--crud-upisi">
                    <span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upiši</span></span></span>
                </button>
            </div>
            <div class="alati-meni-test__footer-center">
                <button type="button" id="btnOsvjezi" class="kontrola-btn">
                    <span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Osvježi meni</span></span></span>
                </button>
            </div>
            <div class="alati-meni-test__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak" aria-label="Povratak na pozivnu formu">
                    <span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span>
                </button>
            </div>
        </div>
    </div>
    </div>
</div>
<!-- Traka ispod panela – cijela širina forme, --c-blue-500, kontejner za meni -->
<div id="traka_h_menija" class="alati-meni-test__traka">
    <button type="button" id="meni_hamburger" class="alati-meni-test__hamburger" aria-label="Meni" aria-expanded="false" aria-haspopup="dialog">☰</button>
    <div id="meni_container" class="alati-meni-test__meni-container"></div>
</div>
<!-- Overlay i drawer za uski prikaz -->
<div id="meni_overlay" class="alati-meni-test__overlay" aria-hidden="true"></div>
<aside id="meni_drawer" class="alati-meni-test__drawer" role="dialog" aria-modal="true" aria-label="Meni (mobilni)">
    <div class="alati-meni-test__drawer-head">
        <button type="button" id="meni_drawer_back" class="alati-meni-test__drawer-btn alati-meni-test__drawer-btn--back" aria-label="Nazad" style="visibility:hidden;">
            <svg class="alati-meni-test__drawer-icon alati-meni-test__drawer-icon--back" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
        </button>
        <div class="alati-meni-test__drawer-title" id="meni_drawer_title">Meni</div>
        <button type="button" id="meni_drawer_close" class="alati-meni-test__drawer-btn" aria-label="Početna">
            <svg class="alati-meni-test__drawer-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
        </button>
    </div>
    <div class="alati-meni-test__drawer-body">
        <div id="meni_drawer_list"></div>
    </div>
</aside>

<script src="../js/00-Version.js?v=1.0.242"></script>
<script src="../js/0-Kontrole.js?v=1.0.242"></script>
<script src="../js/0-Common.js?v=1.0.242"></script>
<script src="../js/0-Razine.js?v=1.0.242"></script>
<script src="../js/0-Poruke.js?v=1.0.242"></script>
<script src="../js/0-Poruke_Tekstovi.js?v=1.0.242"></script>
<script src="../js/Alati_Meni_Test.js?v=1.0.242"></script>

</body>
</html>
