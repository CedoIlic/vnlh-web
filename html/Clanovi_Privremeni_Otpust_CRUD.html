<!DOCTYPE html>
<!--
  Clanovi_Privremeni_Otpust_CRUD.html – privremeni otpust člana (1.g.II).
  Prvi panel = panel tablica: zaglavlje (logo lože lijevo + Država/Regija/Loža + traži + reload),
  tijelo = tablica članova odabrane lože koji TRENUTNO imaju aktivan privremeni otpust (Prezime, Ime, St.).
  Ispod: edit panel (Član, Datum od, Datum do, Napomena, audit RO) + CRUD podnožje.
  Uzor: Clanovi_Promjena_Loze_Izlazak_CRUD (geo/logo/tablica). Samo desktop (device=1).
-->
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Privremeni otpust</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../slike/VNLH_Favicon.png?v=1.0.247" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../css/0-Common.css?v=1.0.247">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=1.0.247">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=1.0.247">
    <link rel="stylesheet" href="../css/Clanovi_CRUD.css?v=1.0.247">
    <link rel="stylesheet" href="../css/Clanovi_Loza_CRUD.css?v=1.0.247">
    <link rel="stylesheet" href="../css/Clanovi_Privremeni_Otpust_CRUD.css?v=1.0.247">
</head>
<body class="vnlh-page-clanovi-privremeni-otpust-crud">
<div class="naslov-forme"><h2>Privremeni otpust</h2></div>
<div class="page-container clanovi-loza-crud clanovi-privremeni-otpust-crud">
    <div class="kontrola-panel-tablica kontrola-panel-tablica--has-header kontrola-panel-tablica--has-header-four-rows kontrola-panel kontrola-panel--resize-y mb-3 clanovi-crud__panel-tablica clanovi-loza-crud__panel-tablica">
        <div class="kontrola-panel__header clanovi-crud__tablica-header clanovi-loza-crud__tablica-header">
            <div class="clanovi-loza-crud__tablica-header-logo-wrap" aria-hidden="true">
                <div class="clanovi-loza-crud__tablica-header-logo-frame">
                    <img id="cpo_loza_logo" class="clanovi-loza-crud__tablica-header-logo-img" alt="" decoding="async" hidden src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                </div>
            </div>
            <div class="clanovi-loza-crud__tablica-header-kontrole">
                <label class="kontrola-labela mb-0" for="select_drzava">Država</label>
                <div class="clanovi-loza-crud__drzava-select-reload">
                    <div class="kontrola-select clanovi-loza-crud__header-select-drzava">
                        <select id="select_drzava" aria-label="Odaberi državu">
                            <option value="">— Odaberi državu —</option>
                        </select>
                    </div>
                </div>
                <label class="kontrola-labela mb-0" for="select_regija">Regija</label>
                <div class="kontrola-select">
                    <select id="select_regija" aria-label="Odaberi regiju" disabled>
                        <option value="">— Odaberi regiju —</option>
                    </select>
                </div>
                <label class="kontrola-labela mb-0" for="select_loza">Loža</label>
                <div class="kontrola-select">
                    <select id="select_loza" aria-label="Odaberi ložu" disabled>
                        <option value="">— Odaberi ložu —</option>
                    </select>
                </div>
                <div class="clanovi-loza-crud__header-kontrole__trazi">
                    <div class="kontrola-edit-delete clanovi-loza-crud__trazi-edit-delete">
                        <span class="clanovi-loza-crud__trazi-lupe" aria-hidden="true"><span class="kontrola-icon--magnifying-glass"></span></span>
                        <input id="cpo_trazi" type="text" class="kontrola-edit-delete__input" autocomplete="off" aria-label="Filtriraj redove u tablici">
                        <button type="button" class="kontrola-edit-delete__clear" aria-label="Očisti traženje" title="Očisti"><span class="kontrola-icon--x-mark" aria-hidden="true"></span></button>
                    </div>
                    <label class="clanovi-privremeni-otpust-crud__prikazi-sve" title="Prikaži sve privremene otpuste (bez obzira na trenutni datum)">
                        <input type="checkbox" id="cpo_prikazi_sve" class="kontrola-checkbox" autocomplete="off" disabled>
                        <span class="clanovi-privremeni-otpust-crud__prikazi-sve-tekst">Prikaži sve privremene otpuste</span>
                    </label>
                    <button type="button" id="btn_reload_tablica" class="clanovi-crud__reload-btn clanovi-loza-crud__reload-btn" aria-label="Ponovno punjenje tablice" title="Puni tablicu"><span class="kontrola-icon--arrow-path" aria-hidden="true"></span></button>
                </div>
            </div>
        </div>
        <div class="kontrola-panel__body">
            <div id="tablicaContainer" class="kontrola-tablica"></div>
        </div>
    </div>

    <div class="kontrola-panel mb-3" id="edit_panel">
        <div class="kontrola-panel__body clanovi-privremeni-otpust-crud__edit-body">
            <div class="clanovi-privremeni-otpust-crud__edit-split">
                <!-- Lijeva kolona: unos -->
                <div class="clanovi-privremeni-otpust-crud__edit-col clanovi-privremeni-otpust-crud__edit-col--left">
                    <div class="clanovi-privremeni-otpust-crud__field">
                        <label class="kontrola-labela mb-0" for="select_clan">Član</label>
                        <div class="kontrola-select">
                            <select id="select_clan" aria-label="Odaberi člana">
                                <option value="">— Odaberi člana —</option>
                            </select>
                        </div>
                    </div>
                    <div class="clanovi-privremeni-otpust-crud__field">
                        <label class="kontrola-labela mb-0" for="edit_datum_od">Datum od</label>
                        <input id="edit_datum_od" type="date" class="kontrola-edit">
                    </div>
                    <div class="clanovi-privremeni-otpust-crud__field">
                        <label class="kontrola-labela mb-0" for="edit_datum_do">Datum do</label>
                        <input id="edit_datum_do" type="date" class="kontrola-edit">
                    </div>
                    <div class="clanovi-privremeni-otpust-crud__field clanovi-privremeni-otpust-crud__field--napomena">
                        <label class="kontrola-labela mb-0" for="edit_napomena">Napomena</label>
                        <textarea id="edit_napomena" class="kontrola-edit" rows="3" placeholder="Razlog i napomena"></textarea>
                    </div>
                </div>
                <!-- Desna kolona: audit (read-only) -->
                <div class="clanovi-privremeni-otpust-crud__edit-col clanovi-privremeni-otpust-crud__edit-col--right">
                    <div class="clanovi-privremeni-otpust-crud__field">
                        <label class="kontrola-labela mb-0" for="ro_prvi_upis">Prvi upis</label>
                        <input id="ro_prvi_upis" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                    </div>
                    <div class="clanovi-privremeni-otpust-crud__field">
                        <label class="kontrola-labela mb-0" for="ro_upisao">Upisao</label>
                        <input id="ro_upisao" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                    </div>
                    <div class="clanovi-privremeni-otpust-crud__field">
                        <label class="kontrola-labela mb-0" for="ro_zadnja_izmjena">Zadnja izmjena</label>
                        <input id="ro_zadnja_izmjena" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                    </div>
                    <div class="clanovi-privremeni-otpust-crud__field">
                        <label class="kontrola-labela mb-0" for="ro_izmijenio">Izmijenio</label>
                        <input id="ro_izmijenio" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                    </div>
                </div>
            </div>
        </div>
        <div class="kontrola-panel__footer clanovi-privremeni-otpust-crud__edit-footer">
            <div class="clanovi-privremeni-otpust-crud__footer-left">
                <button type="button" id="btnUpisi" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upiši</span></span></span></button>
            </div>
            <div class="clanovi-privremeni-otpust-crud__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
            </div>
        </div>
    </div>
</div>
<script src="../js/00-Version.js?v=1.0.247"></script>
<script src="../js/0-Kontrole.js?v=1.0.247"></script>
<script src="../js/0-Common.js?v=1.0.247"></script>
<script src="../js/0-Poruke.js?v=1.0.247"></script>
<script src="../js/0-Poruke_Tekstovi.js?v=1.0.247"></script>
<script src="../js/0-Filteri_Po_Ogranicenjima.js?v=1.0.247"></script>
<script src="../js/Clanovi_Privremeni_Otpust_CRUD.js?v=1.0.247"></script>
</body>
</html>
