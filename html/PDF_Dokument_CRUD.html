<!-- =========================================================
     PDF_Dokument_CRUD.html — forma „Dokumenti" (PDF generator).
     Tab Podaci: lijevo tablica dokumenata + naziv + nasljedi; desno edit odabrane stavke.
     Tab Dokument: postavke dokumenta + popis stavki (dodaj/obriši/gore/dolje).
     Tab PDF: živi preview (PDF_Generator_resolve.php → js/pdf-render.js → iframe).
     ========================================================= -->
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Dokumenti</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../slike/VNLH_Favicon.png?v=__VNLH_ASSET_V__" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../css/0-Common.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Kontrole_Tab.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/PDF_Dokument_CRUD.css?v=__VNLH_ASSET_V__">
</head>
<body>
<div class="naslov-forme"><h2>Dokumenti</h2></div>
<div class="page-container pdf-dokument-crud">
  <div class="kontrola-panel pdf-dokument-crud__panel">
    <div class="kontrola-panel__body">

    <!-- Tabovi -->
    <div class="kontrola-tab pdf-dokument-crud__tab" id="dokTab" role="tablist" aria-label="Uređivanje dokumenta">
        <div class="kontrola-tab__traka" role="presentation">
            <button type="button" class="kontrola-tab__kartica kontrola-tab__kartica--aktivna" role="tab" id="dokTabKart0" aria-selected="true" aria-controls="dokTabPanel0" data-tab-index="0">Podaci</button>
            <button type="button" class="kontrola-tab__kartica" role="tab" id="dokTabKart1" aria-selected="false" aria-controls="dokTabPanel1" data-tab-index="1" tabindex="-1">Dokument</button>
            <button type="button" class="kontrola-tab__kartica" role="tab" id="dokTabKart2" aria-selected="false" aria-controls="dokTabPanel2" data-tab-index="2" tabindex="-1" disabled>PDF</button>
            <!-- Akcija: Dodaj stavku (vidljivo samo na tabu Podaci, gdje se stavka uređuje) -->
            <div class="pdf-dokument-crud__zaglavlje-akcije" id="podaciAkcijeHeader" hidden>
                <button type="button" id="btnStavkaDodaj" class="kontrola-btn"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Dodaj</span></span></span></button>
            </div>
            <!-- Akcije stavki (vidljivo samo na tabu Dokument) – desni rub trake, u ravnini s naslovima -->
            <div class="pdf-dokument-crud__zaglavlje-akcije" id="stavkeAkcijeHeader" hidden>
                <button type="button" id="btnStavkaObrisi" class="kontrola-btn" disabled><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Obriši</span></span></span></button>
                <button type="button" id="btnStavkaGore" class="kontrola-btn" disabled><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">▲</span></span></span></button>
                <button type="button" id="btnStavkaDolje" class="kontrola-btn" disabled><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">▼</span></span></span></button>
            </div>
            <!-- Akcije PDF preview-a (vidljivo samo na tabu PDF) – desni rub trake -->
            <div class="pdf-dokument-crud__zaglavlje-akcije" id="pdfAkcijeHeader" hidden>
                <span id="previewInfo" class="pdf-dokument-crud__preview-info"></span>
                <button type="button" id="btnPreview" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Osvježi</span></span></span></button>
                <button type="button" id="btnBlokovi" class="pdf-dokument-crud__blok-toggle" aria-pressed="false" title="Prikaži vodilice stranice (margine, zaglavlje, podnožje)" disabled></button>
                <button type="button" id="btnBlokStranica" class="pdf-dokument-crud__blok-toggle pdf-dokument-crud__blok-stranica" title="Prikaz pravila za 1. / 2. stranicu" disabled></button>
            </div>
        </div>

        <div class="kontrola-tab__tijelo">

        <!-- ===== Tab 0: PODACI (lijevo dokumenti + naziv + nasljedi; desno edit stavke) ===== -->
        <div class="kontrola-tab__panel" role="tabpanel" id="dokTabPanel0" aria-labelledby="dokTabKart0" data-tab-index="0">
          <div class="pdf-dokument-crud__podaci">

            <!-- Lijeva kolona -->
            <div class="pdf-dokument-crud__lijevo">
                <!-- Tablica dokumenata + resize traka (panel-tablica mehanizam, bez vidljivog panel-okvira) -->
                <div class="kontrola-panel kontrola-panel-tablica kontrola-panel--resize-y pdf-dokument-crud__tablica-resize mb-2">
                    <div class="kontrola-panel__body">
                        <div id="dokTablica" class="kontrola-tablica"></div>
                    </div>
                </div>
                <div class="pdf-dokument-crud__polje">
                    <label class="kontrola-labela mb-0" for="edit_naziv">Naziv dokumenta</label>
                    <div class="kontrola-edit-delete">
                        <input id="edit_naziv" type="text" class="kontrola-edit-delete__input" placeholder="npr. Zapisnik lože" maxlength="100" autocomplete="off">
                        <button type="button" class="kontrola-edit-delete__clear" aria-label="Obriši sadržaj">×</button>
                    </div>
                </div>
                <div class="pdf-dokument-crud__polje" id="naslijediWrap">
                    <label class="kontrola-labela mb-0" for="edit_naslijedi_dok">Nasljedi dokument</label>
                    <div class="kontrola-select"><select id="edit_naslijedi_dok" aria-label="Nasljedi dokument">
                        <option value="">— odaberi —</option>
                    </select></div>
                </div>
                <div class="pdf-dokument-crud__polje">
                    <label class="kontrola-labela mb-0" for="edit_template_id">Stranica (template)</label>
                    <div class="kontrola-select"><select id="edit_template_id" aria-label="Template">
                        <option value="">— odaberi —</option>
                    </select></div>
                </div>
                <div class="pdf-dokument-crud__polje">
                    <label class="kontrola-labela mb-0" for="edit_opis">Opis</label>
                    <input id="edit_opis" type="text" class="kontrola-edit" placeholder="opcionalno" maxlength="255" autocomplete="off">
                </div>
            </div>

            <!-- Desna kolona: edit odabrane stavke (preslažemo dalje) -->
            <div class="pdf-dokument-crud__desno">
                <div class="pdf-dokument-crud__stavka-edit" id="stavkaEdit">
                    <div class="pdf-dokument-crud__dva-stupca">

                        <div class="pdf-dokument-crud__stupac">
                            <div class="pdf-dokument-crud__polje">
                                <label class="kontrola-labela mb-0" for="st_zona">Zona</label>
                                <div class="kontrola-select"><select id="st_zona" aria-label="Zona">
                                    <option value="tijelo">Tijelo</option>
                                    <option value="zaglavlje">Zaglavlje</option>
                                    <option value="podnozje">Podnožje</option>
                                    <option value="naslovna">Naslovna</option>
                                </select></div>
                            </div>
                            <div class="pdf-dokument-crud__polje">
                                <label class="kontrola-labela mb-0" for="st_vrsta">Vrsta</label>
                                <div class="kontrola-select"><select id="st_vrsta" aria-label="Vrsta">
                                    <option value="tekst">Tekst</option>
                                    <option value="slika">Slika</option>
                                </select></div>
                            </div>
                            <div class="pdf-dokument-crud__polje">
                                <label class="kontrola-labela mb-0" for="st_izvor">Izvor (whitelist)</label>
                                <div class="kontrola-select"><select id="st_izvor" aria-label="Izvor">
                                    <option value="">— odaberi —</option>
                                </select></div>
                            </div>
                            <div class="pdf-dokument-crud__polje">
                                <label class="kontrola-labela mb-0" for="st_izvor_tip">Način dohvata</label>
                                <div class="kontrola-select"><select id="st_izvor_tip" aria-label="Način dohvata">
                                    <option value="staticki">Statički (fiksni ID)</option>
                                    <option value="dinamicki">Dinamički (iz konteksta)</option>
                                    <option value="po_vrijednosti">Po vrijednosti</option>
                                </select></div>
                            </div>
                            <div class="pdf-dokument-crud__polje" id="polje_izvor_red_id">
                                <label class="kontrola-labela mb-0" for="st_izvor_red_id">ID retka (statički)</label>
                                <input id="st_izvor_red_id" type="text" class="kontrola-edit" inputmode="numeric" placeholder="0" autocomplete="off">
                            </div>
                            <div class="pdf-dokument-crud__polje" id="polje_paragraf">
                                <label class="kontrola-labela mb-0" for="st_paragraf_id">Stil teksta</label>
                                <div class="kontrola-select"><select id="st_paragraf_id" aria-label="Stil teksta">
                                    <option value="">— odaberi —</option>
                                </select></div>
                            </div>
                        </div>

                        <div class="pdf-dokument-crud__stupac">
                            <div class="pdf-dokument-crud__polje" id="polje_kontekst_kljuc">
                                <label class="kontrola-labela mb-0" for="st_kontekst_kljuc">Ključ konteksta (dinamički)</label>
                                <input id="st_kontekst_kljuc" type="text" class="kontrola-edit" placeholder="npr. loza_id" maxlength="64" autocomplete="off">
                            </div>
                            <div class="pdf-dokument-crud__polje" id="polje_trazi_kolona">
                                <label class="kontrola-labela mb-0" for="st_trazi_kolona">Traži kolonu (po vrijednosti)</label>
                                <input id="st_trazi_kolona" type="text" class="kontrola-edit" placeholder="npr. naziv" maxlength="64" autocomplete="off">
                            </div>
                            <div class="pdf-dokument-crud__polje" id="polje_trazi_vrijednost">
                                <label class="kontrola-labela mb-0" for="st_trazi_vrijednost">Tražena vrijednost</label>
                                <input id="st_trazi_vrijednost" type="text" class="kontrola-edit" placeholder="npr. VNLH Logo" maxlength="255" autocomplete="off">
                            </div>
                            <div class="pdf-dokument-crud__polje">
                                <label class="kontrola-checkbox-labela"><input id="edit_aktivan" type="checkbox" class="kontrola-checkbox"> Aktivan</label>
                            </div>
                            <div class="pdf-dokument-crud__polje">
                                <label class="kontrola-labela mb-0" for="edit_napomena">Napomena</label>
                                <textarea id="edit_napomena" class="kontrola-napomena" rows="2" placeholder="Slobodna bilješka..." maxlength="1024"></textarea>
                            </div>
                            <div class="pdf-dokument-crud__polje" id="polje_slika_stil">
                                <label class="kontrola-labela mb-0" for="st_slika_stil_id">Stil slike</label>
                                <div class="kontrola-select"><select id="st_slika_stil_id" aria-label="Stil slike">
                                    <option value="">— odaberi —</option>
                                </select></div>
                            </div>
                        </div>
                    </div>
                    <div class="pdf-dokument-crud__stavka-hint" id="stavkaHint">(odaberi stavku u tabu „Dokument" ili dodaj novu)</div>
                </div>
            </div>

          </div>
        </div>

        <!-- ===== Tab 1: DOKUMENT (postavke + popis stavki) ===== -->
        <div class="kontrola-tab__panel" role="tabpanel" id="dokTabPanel1" aria-labelledby="dokTabKart1" data-tab-index="1" hidden>
            <!-- Popis stavki (akcije su u zaglavlju taba) -->
            <div id="stavkeTablica" class="kontrola-tablica"></div>
        </div>

        <!-- ===== Tab 2: PDF (živi preview) ===== -->
        <div class="kontrola-tab__panel" role="tabpanel" id="dokTabPanel2" aria-labelledby="dokTabKart2" data-tab-index="2" hidden>
            <!-- Kontrole su u zaglavlju taba -->
            <iframe id="previewOkvir" class="pdf-dokument-crud__preview-okvir" title="PDF pregled"></iframe>
        </div>

        </div>
    </div>
    </div>

    <!-- Footer: spremi / izbriši / povratak (podnožje panela) -->
    <div class="kontrola-panel__footer pdf-dokument-crud__footer">
        <div class="pdf-dokument-crud__footer-left">
            <button type="button" id="btnSpremi" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upis</span></span></span></button>
            <button type="button" id="btnIzbrisi" class="kontrola-btn kontrola-btn--crud-izbrisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Izbriši</span></span></span></button>
        </div>
        <div class="pdf-dokument-crud__footer-right">
            <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
        </div>
    </div>
  </div>

</div>

<script src="../js/00-Version.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Kontrole.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Kontrole_Tab.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Common.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke_Tekstovi.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/pdf-render.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/PDF_Dokument_CRUD.js?v=__VNLH_ASSET_V__"></script>
</body>
</html>
