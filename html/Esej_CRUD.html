<!-- =========================================================
     Esej_CRUD.html
     Eseji – geo-blok (Država / Regija / Loža), logo lože, ikone (odabir + PDF), tab kontrola s dva taba
     (Opći podaci | Esej), CRUD podnožje. Skripte: 0-Kontrole.js, 0-Common.js,
     0-Filteri_Po_Ogranicenjima.js, 0-Poruke_Tekstovi.js, 0-Kontrole_Tab.js, Esej_CRUD.js.
     URL param: mod_upisa_eseja=0 (novi, zadano) | 1 (izmjena postojećeg).
     ========================================================= -->
<!DOCTYPE html>
<html lang="hr">
<head>
    <script>window.VNLH_TEKUCI_KORISNIK=__VNLH_TEKUCI_KORISNIK__;window.VNLH_LIMIT_ZAHVAT=__VNLH_LIMIT_ZAHVAT__;</script>
    <meta charset="UTF-8">
    <title>Eseji</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../slike/VNLH_Favicon.png?v=1.0.247" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../css/0-Common.css?v=1.0.247">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=1.0.247">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=1.0.247">
    <link rel="stylesheet" href="../css/0-Kontrole_Tab.css?v=1.0.247">
    <link rel="stylesheet" href="../css/Clanovi_Loza_CRUD.css?v=1.0.247">
    <link rel="stylesheet" href="../css/Esej_CRUD.css?v=1.0.247">
</head>
<body>
<div class="naslov-forme"><h2>Eseji</h2></div>
<div class="page-container esej-crud__wrap">
    <div class="kontrola-panel kontrola-panel--traka-desktop kontrola-panel--resize-y esej-crud__panel mb-3" data-resize-max-vh="full" data-resize-min-px="400" id="esejPanel">
        <!-- Logo + Država / Regija / Loža (kao zaglavlje tablice u Clanovi_Loza_CRUD; CSS: .clanovi-loza-crud__tablica-header-*). -->
        <div class="kontrola-panel__header clanovi-loza-crud__tablica-header esej-crud__panel-header" role="group" aria-label="Zaglavlje eseja">
            <div class="clanovi-loza-crud__tablica-header-logo-wrap" aria-hidden="true">
                <div class="clanovi-loza-crud__tablica-header-logo-frame">
                    <img id="clanovi_loza_tablica_logo" class="clanovi-loza-crud__tablica-header-logo-img" alt="" decoding="async" draggable="false" hidden src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                </div>
            </div>
            <div class="clanovi-loza-crud__tablica-header-kontrole">
                <label class="kontrola-labela mb-0" for="select_drzava">Država</label>
                <div class="kontrola-select clanovi-loza-crud__header-select-drzava">
                    <select id="select_drzava" aria-label="Odaberi državu">
                        <option value="">— Odaberi državu —</option>
                    </select>
                </div>
                <label class="kontrola-labela mb-0" for="select_regija">Regija</label>
                <div class="kontrola-select">
                    <select id="select_regija" aria-label="Odaberi regiju" disabled>
                        <option value="">— Odaberi regiju —</option>
                    </select>
                </div>
                <label class="kontrola-labela mb-0" for="select_loza">Loža</label>
                <div class="kontrola-select">
                    <select id="select_loza" aria-label="Odaberi ložu" disabled>
                        <option value="">— Odaberi ložu —</option>
                    </select>
                </div>
                <!-- Ikone: odabir postojećeg eseja + PDF; red ispod selekta Loža, poravnanje udesno. -->
                <div class="esej-crud__header-icon-actions-wrap">
                    <svg id="esej_ro_lokot" hidden aria-label="Esej je zaključan (samo pregled)" role="img"
                         viewBox="0 0 24 24" fill="currentColor"
                         style="display:none;width:2.25rem;height:2.25rem;color:var(--c-red-900);flex-shrink:0;align-self:center;filter:drop-shadow(0 4px 10px var(--c-text-shadow-75));">
                        <path d="M12 1C9.24 1 7 3.24 7 6v2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-2V6c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v2H9V6c0-1.66 1.34-3 3-3zm1 11.73V17h-2v-2.27A2 2 0 0 1 10 13a2 2 0 0 1 4 0 2 2 0 0 1-1 1.73z"/>
                    </svg>
                    <button type="button" id="esej_btn_odabir_postojeceg" class="esej-crud__header-odabir-esej-btn" disabled aria-label="Odaberi postojeći esej" title="Postojeći esej">
                        <svg class="esej-crud__header-odabir-esej-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <line x1="10" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="10" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="10" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <polygon points="3 9 8 12 3 15" fill="currentColor"/>
                        </svg>
                    </button>
                    <button type="button" id="esej_btn_pdf" class="esej-crud__header-pdf-btn" disabled aria-label="Generiraj PDF eseja" title="Generiraj PDF">
                        <svg class="esej-crud__header-pdf-icon" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                                  fill="none" stroke="currentColor" stroke-width="1.5"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                            <polyline points="14 2 14 8 20 8" fill="none" stroke="currentColor"
                                      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <rect x="5" y="14" width="14" height="6" rx="1" fill="currentColor"/>
                            <text x="12" y="18.4" font-family="Arial, sans-serif" font-size="3.8"
                                  font-weight="bold" fill="white" text-anchor="middle">PDF</text>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="kontrola-panel__body esej-crud__panel-body">
            <div class="kontrola-tab kontrola-tab--kartice-sirina-proporcija esej-crud__tab" id="esejKontrolaTab" role="tablist" aria-label="Kartice eseja">
                <div class="kontrola-tab__traka" role="presentation">
                    <button type="button" class="kontrola-tab__kartica kontrola-tab__kartica--aktivna" role="tab" id="esejKontrolaTabKart0" aria-selected="true" aria-controls="esejKontrolaTabPanel0" data-tab-index="0" disabled>Opći podaci</button>
                    <button type="button" class="kontrola-tab__kartica" role="tab" id="esejKontrolaTabKart1" aria-selected="false" aria-controls="esejKontrolaTabPanel1" data-tab-index="1" tabindex="-1" disabled>Esej</button>
                </div>
                <div class="kontrola-tab__tijelo" role="presentation">
                    <!-- Tab 0: Opći podaci — lijeva kolona (Autor, Stupanj, Javno dostupan, Upisao) + desna (Ključne riječi). -->
                    <div class="kontrola-tab__panel esej-crud__tab-panel--opci-podaci" role="tabpanel" id="esejKontrolaTabPanel0" aria-labelledby="esejKontrolaTabKart0">
                        <div class="esej-crud__opci-grid">
                            <!-- Lijeva kolona -->
                            <div class="esej-crud__opci-kol esej-crud__opci-kol--lijevo">
                                <div class="esej-crud__polje-stog">
                                    <label id="esej_autor_label" class="kontrola-labela mb-0">Autor eseja</label>
                                    <div class="esej-crud__autor-red">
                                        <div class="kontrola-edit-delete esej-crud__autor-edit-delete">
                                            <div id="esej_autor" class="kontrola-edit-delete__input kontrola-edit-delete__input--rich-html" tabindex="0" role="textbox" contenteditable="false" aria-readonly="true" aria-labelledby="esej_autor_label"></div>
                                            <button type="button" class="kontrola-edit-delete__clear" aria-label="Obriši odabir autora" title="Obriši odabir"><span class="kontrola-icon--x-mark" aria-hidden="true"></span></button>
                                        </div>
                                        <button type="button" id="esej_btn_autor_ellipsis" class="esej-crud__ellipsis-btn esej-crud__opci-kontrola" aria-label="Odabir autora" title="Odabir autora" disabled>
                                            <span class="kontrola-icon--ellipsis-horizontal" aria-hidden="true"></span>
                                        </button>
                                    </div>
                                </div>
                                <div class="esej-crud__polje-stog">
                                    <label class="kontrola-labela mb-0" for="esej_naslov_eseja">Naslov eseja</label>
                                    <input id="esej_naslov_eseja" type="text" class="kontrola-edit esej-crud__opci-kontrola" maxlength="250" autocomplete="off" aria-label="Naslov eseja" disabled>
                                </div>
                                <div class="esej-crud__polje-stog">
                                    <label class="kontrola-labela mb-0" for="esej_select_stupanj">Esej je namjenjen stupnju</label>
                                    <div class="kontrola-select">
                                        <select id="esej_select_stupanj" class="esej-crud__opci-kontrola" aria-label="Stupanj eseja" disabled>
                                            <option value="">— Odaberi stupanj —</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="esej-crud__cb-red">
                                    <input type="checkbox" id="esej_javno_dostupan" class="kontrola-checkbox esej-crud__opci-kontrola" value="1" disabled>
                                    <label class="kontrola-labela mb-0" for="esej_javno_dostupan">Esej je javno dostupan</label>
                                </div>
                                <div class="esej-crud__polje-stog">
                                    <label class="kontrola-labela mb-0" for="esej_upisao">Esej je upisao</label>
                                    <input id="esej_upisao" type="text" class="kontrola-edit kontrola-edit--readonly esej-crud__opci-kontrola" readonly tabindex="-1" aria-label="Esej je upisao">
                                </div>
                            </div>
                            <!-- Desna kolona: Ključne riječi (premješteno s taba Esej) -->
                            <div class="esej-crud__opci-kol esej-crud__opci-kol--desno">
                                <div class="esej-crud__polje-stog esej-crud__polje-stog--raste">
                                    <label class="kontrola-labela mb-0" for="esej_kljucne_rijeci">Ključne riječi</label>
                                    <div class="esej-crud__scrol-omot esej-crud__opci-kljucne-omot">
                                        <textarea id="esej_kljucne_rijeci" class="kontrola-napomena esej-crud__opci-kljucne esej-crud__opci-kontrola" rows="4" spellcheck="true" aria-label="Ključne riječi eseja" disabled></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Tab 1: Esej — samo Sadržaj eseja. -->
                    <div class="kontrola-tab__panel esej-crud__tab-panel--esej" role="tabpanel" id="esejKontrolaTabPanel1" aria-labelledby="esejKontrolaTabKart1" hidden>
                        <div class="esej-crud__esej-tab" role="group" aria-label="Sadržaj eseja">
                            <div class="esej-crud__esej-blok esej-crud__esej-blok--sadrzaj">
                                <label id="esej_sadrzaj_label" class="kontrola-labela mb-0">Sadržaj eseja</label>
                                <div class="esej-crud__scrol-omot esej-crud__sadrzaj-omot">
                                    <div id="esej_sadrzaj" class="kontrola-napomena esej-crud__esej-textarea esej-crud__esej-kontrola" contenteditable="false" role="textbox" aria-multiline="true" aria-labelledby="esej_sadrzaj_label" spellcheck="true"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="kontrola-panel__footer esej-crud__edit-footer">
            <div class="esej-crud__footer-left">
                <button type="button" id="btnUpisi" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upis</span></span></span></button>
                <button type="button" id="btnIzbrisi" class="kontrola-btn kontrola-btn--crud-izbrisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Izbriši</span></span></span></button>
            </div>
            <div class="esej-crud__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
            </div>
        </div>
    </div>
</div>
<!-- Modal za odabir autora eseja (modal-tablica uzorak: drag zaglavlja, resize traka + kut, localStorage pozicija/veličina) -->
<div id="esejModalAutor" class="modal-tablica esej-crud__modal-autor" role="dialog" aria-label="Odaberi autora rada" aria-modal="true" aria-hidden="true">
    <div class="modal-tablica__overlay"></div>
    <div class="modal-tablica__dialog">
        <div class="modal-tablica__header esej-crud__modal-autor-header">
            <div class="esej-crud__modal-autor-naslov">Odaberi autora rada</div>
            <div class="esej-crud__modal-autor-trazi-red">
                <label class="kontrola-labela mb-0" for="esej_modal_autor_trazi">Pretraži</label>
                <div class="kontrola-edit-delete esej-crud__modal-autor-trazi-wrap">
                    <span class="esej-crud__modal-autor-trazi-lupa" aria-hidden="true"><span class="kontrola-icon--magnifying-glass"></span></span>
                    <input id="esej_modal_autor_trazi" type="text" class="kontrola-edit-delete__input" autocomplete="off" maxlength="200" placeholder="">
                    <button type="button" class="kontrola-edit-delete__clear" aria-label="Očisti pretragu"><span class="kontrola-icon--x-mark" aria-hidden="true"></span></button>
                </div>
            </div>
        </div>
        <div class="modal-tablica__body esej-crud__modal-autor-body">
            <div class="modal-tablica__body-table-wrap">
                <div id="esej_modal_autor_tablica" class="kontrola-tablica tablica--podaci-h-linije esej-crud__modal-autor-tablica" aria-label="Članovi lože">
                    <div class="kontrola-tablica__inner">
                        <div class="kontrola-tablica__header">
                            <table><thead><tr><th class="kontrola-tablica__th--no-sort">Članovi lože</th></tr></thead></table>
                        </div>
                        <div class="kontrola-tablica__scroll-wrap">
                            <div class="kontrola-tablica__scroll" tabindex="0" id="esej_modal_autor_scroll">
                                <table><tbody id="esej_modal_autor_tbody"></tbody></table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="kontrola-panel__resize-bar" id="esej_modal_autor_resize_bar"></div>
        </div>
        <div class="modal-tablica__footer">
            <button type="button" id="esej_modal_autor_ok" class="kontrola-btn kontrola-btn--primary" disabled><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">U redu</span></span></span></button>
            <button type="button" id="esej_modal_autor_cancel" class="kontrola-btn"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Odustani</span></span></span></button>
        </div>
        <div class="modal-tablica__resize-corner esej-crud__modal-autor-resize-corner" id="esej_modal_autor_resize_corner"></div>
    </div>
</div>
<!-- Modal: lista eseji za odabir/editiranje -->
<div id="esejModalLista" class="modal-tablica esej-crud__modal-lista" role="dialog" aria-label="Odaberi esej za editiranje" aria-modal="true" aria-hidden="true">
    <div class="modal-tablica__overlay"></div>
    <div class="modal-tablica__dialog">
        <div class="modal-tablica__header esej-crud__modal-autor-header">
            <div class="esej-crud__modal-autor-naslov">Odaberi esej za editiranje</div>
            <div class="esej-crud__modal-autor-trazi-red">
                <label class="kontrola-labela mb-0" for="esej_modal_lista_trazi">Pretraži</label>
                <div class="kontrola-edit-delete esej-crud__modal-autor-trazi-wrap">
                    <span class="esej-crud__modal-autor-trazi-lupa" aria-hidden="true"><span class="kontrola-icon--magnifying-glass"></span></span>
                    <input id="esej_modal_lista_trazi" type="text" class="kontrola-edit-delete__input" autocomplete="off" maxlength="200" placeholder="">
                    <button type="button" class="kontrola-edit-delete__clear" aria-label="Očisti pretragu"><span class="kontrola-icon--x-mark" aria-hidden="true"></span></button>
                </div>
            </div>
            <div class="esej-crud__modal-lista-legenda">
                <label class="kontrola-labela mb-0">Legenda</label>
                <div class="esej-crud__modal-lista-legenda-red">
                    <span class="esej-crud__modal-lista-legenda-kv" id="esej_modal_lista_leg_kv1"></span>
                    <label class="kontrola-labela mb-0">Esej je postavljen kao javan.</label>
                </div>
                <div class="esej-crud__modal-lista-legenda-red">
                    <span class="esej-crud__modal-lista-legenda-kv" id="esej_modal_lista_leg_kv2"></span>
                    <label class="kontrola-labela mb-0">Esej druge lože koji je javno dostupan.</label>
                </div>
            </div>
        </div>
        <div class="modal-tablica__body esej-crud__modal-autor-body">
            <div class="modal-tablica__body-table-wrap">
                <div id="esej_modal_lista_tablica" class="kontrola-tablica tablica--podaci-h-linije esej-crud__modal-lista-tablica" aria-label="Eseji">
                    <div class="kontrola-tablica__inner">
                        <div class="kontrola-tablica__header">
                            <table><thead><tr><th class="kontrola-tablica__th--no-sort">Eseji</th></tr></thead></table>
                        </div>
                        <div class="kontrola-tablica__scroll-wrap">
                            <div class="kontrola-tablica__scroll" tabindex="0" id="esej_modal_lista_scroll">
                                <table><tbody id="esej_modal_lista_tbody"></tbody></table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="kontrola-panel__resize-bar" id="esej_modal_lista_resize_bar"></div>
        </div>
        <div class="modal-tablica__footer">
            <button type="button" id="esej_modal_lista_zatvori" class="kontrola-btn"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Zatvori</span></span></span></button>
        </div>
        <div class="modal-tablica__resize-corner esej-crud__modal-autor-resize-corner" id="esej_modal_lista_resize_corner"></div>
    </div>
</div>
<!-- Popup: ključne riječi eseja (hover/klik na elipsis u retku) -->
<div id="esejKljucnePopup" class="esej-crud__kljucne-popup" hidden>
    <div class="esej-crud__kljucne-popup-naslov">Ključne riječi</div>
    <div class="esej-crud__kljucne-popup-tekst" id="esej_kljucne_popup_tekst"></div>
    <div class="esej-crud__kljucne-popup-footer">
        <button type="button" id="esej_kljucne_popup_izlaz" class="kontrola-btn"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Izlaz</span></span></span></button>
    </div>
</div>
<!-- Modal: PDF pregled eseja (render dokumenta „Esej" iz baze + uživo podešavanje extra-proreda) -->
<div id="esejModalPdf" class="esej-crud__modal-pdf" role="dialog" aria-label="PDF eseja" aria-modal="true" aria-hidden="true">
    <div class="esej-crud__modal-pdf-overlay"></div>
    <div class="esej-crud__modal-pdf-dialog">
        <div class="esej-crud__modal-pdf-header">
            <div class="esej-crud__modal-pdf-naslov">PDF eseja</div>
            <div class="esej-crud__modal-pdf-alati" role="group" aria-label="Alati PDF-a">
                <label class="kontrola-labela mb-0" for="esej_pdf_prored">Prored</label>
                <div class="esej-crud__stepper">
                    <input id="esej_pdf_prored" type="text" class="kontrola-edit esej-crud__stepper-input" inputmode="decimal" value="1,00" aria-label="Množitelj proreda (0,80–2,00)">
                    <span class="esej-crud__stepper-strelice">
                        <button type="button" id="esej_pdf_prored_gore" class="esej-crud__stepper-btn" aria-label="Povećaj prored za 0,1" tabindex="-1">&#9650;</button>
                        <button type="button" id="esej_pdf_prored_dolje" class="esej-crud__stepper-btn" aria-label="Smanji prored za 0,1" tabindex="-1">&#9660;</button>
                    </span>
                </div>
                <button type="button" id="esej_pdf_save" class="esej-crud__modal-pdf-ikona-btn" aria-label="Spremi prored" title="Spremi prored">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
                        <path d="M17 21v-8H7v8M7 3v5h8"/>
                    </svg>
                </button>
                <span class="esej-crud__modal-pdf-slot" aria-hidden="true"></span>
                <span class="esej-crud__modal-pdf-slot" aria-hidden="true"></span>
                <button type="button" id="esej_pdf_refresh" class="esej-crud__modal-pdf-ikona-btn" aria-label="Osvježi PDF" title="Osvježi PDF">
                    <span class="kontrola-icon--arrow-path" aria-hidden="true"></span>
                </button>
            </div>
        </div>
        <div class="esej-crud__modal-pdf-body">
            <iframe id="esej_pdf_okvir" class="esej-crud__modal-pdf-iframe" title="PDF pregled eseja"></iframe>
            <div id="esej_pdf_spiner" class="kontrola-spiner-overlay" aria-hidden="true">
                <span class="kontrola-spiner kontrola-spiner--segment" role="status" aria-label="Učitavanje"></span>
