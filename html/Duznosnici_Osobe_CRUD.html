<!DOCTYPE html>
<!--
  Duznosnici_Osobe_CRUD.html – Nosioci dužnosti: dužnosti + aktivni članovi, dodjela u donjem panelu.
-->
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Nosioci dužnosti - Sekretarijat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="../slike/VNLH_Favicon.png?v=__VNLH_ASSET_V__" type="image/png" sizes="32x32">
<link rel="stylesheet" href="../css/0-Common.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/Duznosnici_Osobe_CRUD.css?v=__VNLH_ASSET_V__">
</head>
<body>
<div class="naslov-forme"><h2>Nosioci dužnosti</h2></div>
<div class="page-container duznosnici-osobe-crud">
    <!-- Blok: Dva panela – Traži + tablica dužnosti | Traži + tablica članova -->
    <div class="duznosnici-osobe-crud__panels-row">
        <div class="kontrola-panel-tablica kontrola-panel-tablica--has-header kontrola-panel kontrola-panel--resize-y mb-3 duznosnici-osobe-crud__panel-tablica duznosnici-osobe-crud__panel-min-equal" data-resize-sync-group="duznosnici-osobe-tablice">
            <div class="kontrola-panel__header duznosnici-osobe-crud__tablica-header">
                <div class="duznosnici-osobe-crud__header-row">
                    <label class="kontrola-labela mb-0" for="edit_trazi_duznost" id="label_trazi_duznost">Traži</label>
                    <div class="kontrola-edit-delete duznosnici-osobe-crud__trazi-wrap">
                        <input id="edit_trazi_duznost" type="text" class="kontrola-edit-delete__input" aria-label="Traži dužnost" placeholder="Traži...">
                        <button type="button" class="kontrola-edit-delete__clear" aria-label="Obriši sadržaj">×</button>
                    </div>
                </div>
            </div>
            <div class="kontrola-panel__body">
                <div id="tablicaContainerDuznost" class="kontrola-tablica"></div>
            </div>
        </div>
        <div class="kontrola-panel-tablica kontrola-panel-tablica--has-header kontrola-panel kontrola-panel--resize-y mb-3 duznosnici-osobe-crud__panel-tablica duznosnici-osobe-crud__panel-min-equal" data-resize-sync-group="duznosnici-osobe-tablice">
            <div class="kontrola-panel__header duznosnici-osobe-crud__tablica-header">
                <div class="duznosnici-osobe-crud__header-row">
                    <label class="kontrola-labela mb-0" for="edit_trazi_osobu" id="label_trazi_osobu">Traži</label>
                    <div class="kontrola-edit-delete duznosnici-osobe-crud__trazi-wrap">
                        <input id="edit_trazi_osobu" type="text" class="kontrola-edit-delete__input" aria-label="Traži osobu" placeholder="Traži...">
                        <button type="button" class="kontrola-edit-delete__clear" aria-label="Obriši sadržaj">×</button>
                    </div>
                </div>
            </div>
            <div class="kontrola-panel__body">
                <div id="tablicaContainerOsoba" class="kontrola-tablica"></div>
            </div>
        </div>
    </div>
    <!-- Blok: Edit panel – zaglavlje (ellipsis desno), tijelo, footer CRUD -->
    <div class="kontrola-panel mb-3" id="edit_panel">
        <div class="kontrola-panel__header duznosnici-osobe-crud__edit-panel-header">
            <button type="button" id="btn_edit_panel_ellipsis" class="duznosnici-osobe-crud__edit-panel-ellipsis-btn" aria-label="Više opcija" title="Više opcija">
                <span class="kontrola-icon--ellipsis-horizontal" aria-hidden="true"></span>
            </button>
        </div>
        <div class="kontrola-panel__body duznosnici-osobe-crud__unos-tijelo">
            <div class="duznosnici-osobe-crud__unos-red">
                <div class="duznosnici-osobe-crud__unos-par">
                    <label class="kontrola-labela mb-0" for="edit_duznost">Dužnost</label>
                    <input id="edit_duznost" type="text" class="kontrola-edit duznosnici-osobe-crud__unos-polje" readonly aria-label="Dužnost">
                </div>
            </div>
            <div class="duznosnici-osobe-crud__unos-red">
                <div class="duznosnici-osobe-crud__unos-par">
                    <label class="kontrola-labela mb-0" for="edit_nosioc">Nosioc</label>
                    <input id="edit_nosioc" type="text" class="kontrola-edit duznosnici-osobe-crud__unos-polje" readonly aria-label="Nosioc">
                </div>
            </div>
        </div>
        <div class="kontrola-panel__footer duznosnici-osobe-crud__edit-footer">
            <div class="duznosnici-osobe-crud__footer-left">
                <button type="button" id="btnUpisi" class="kontrola-btn kontrola-btn--crud-upisi" aria-label="Upiši"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upiši</span></span></span></button>
                <button type="button" id="btnIzbrisi" class="kontrola-btn kontrola-btn--crud-izbrisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Izbriši</span></span></span></button>
            </div>
            <div class="duznosnici-osobe-crud__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
            </div>
        </div>
    </div>
</div>
<script src="../js/00-Version.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Kontrole.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Common.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke_Tekstovi.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/Duznosnici_Osobe_CRUD.js?v=__VNLH_ASSET_V__"></script>
</body>
</html>
