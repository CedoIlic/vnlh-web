<!DOCTYPE html>
<!--
  Duznosnici_Ogranicenja_CRUD.html – forma za ograničenja dužnosnika.
  Zaglavlje panela: Dužnosnik (opcijski toggle „Svi“ + select + reload), zatim Država, Regija, Loža (svaki: edit + ellipsis). Na uskim uređajima labela iznad, kontrole ispod; breakpoint --page_breakpoint_narrow.
  Prvi panel – tablica: Upis/izmjena (checkbox), Brisanje sloga (checkbox), Funkcionalnost (bez podnožja).
  Drugi panel – zaglavlje „Prikaz stupnjeva po obredu“, tablica Obred + ID dozvoljenih stupnjeva (ellipsis u retku); podnožje: CRUD tipke (Upis, Izbriši, Povratak).
  Oba panela: data-resize-max-vh="none" – vertikalni resize nije ograničen na 90% ekrana; dugačka forma – pomicanje prstom (0-Kontrole.js initPanelResizeBar).
  Ovisnosti: 0-Common.css, 0-Kontrole.css, Duznosnici_Ogranicenja_CRUD.css; 0-Kontrole.js, 0-Common.js, 0-Razine.js (select dužnosnika), 0-Poruke*.js, Duznosnici_Ogranicenja_CRUD.js.
  Master za select: window.VNLH_OGRANICENJA_MASTER_ID (PHP: __VNLH_SESSION_MASTER_ID_DUZNOSNIK__).
-->
<html lang="hr">
<head>
    <script>window.VNLH_OGRANICENJA_MASTER_ID=__VNLH_SESSION_MASTER_ID_DUZNOSNIK__;window.VNLH_ID_KORISNIK=__VNLH_ID_KORISNIK__;</script>
    <meta charset="UTF-8">
    <title>Ograničenja dužnosnika</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="../slike/VNLH_Favicon.png?v=1.0.241" type="image/png" sizes="32x32">
<link rel="stylesheet" href="../css/0-Common.css?v=1.0.241">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=1.0.241">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=1.0.241">
    <link rel="stylesheet" href="../css/Duznosnici_Ogranicenja_CRUD.css?v=1.0.241">
</head>
<body>
<div class="naslov-forme"><h2>Ograničenja dužnosnika</h2></div>
<div class="page-container duznosnici-ogranicenja-crud">
    <!-- Blok: Panel tablice s zaglavljem (Dužnosnik, Država, Regija, Loža) -->
    <div class="kontrola-panel-tablica kontrola-panel-tablica--has-header kontrola-panel-tablica--has-header-four-rows kontrola-panel kontrola-panel--resize-y mb-3" data-resize-max-vh="none">
        <div class="kontrola-panel__header duznosnici-ogranicenja-crud__tablica-header">
            <!-- Blok: Red zaglavlja – Dužnosnik -->
            <div class="duznosnici-ogranicenja-crud__header-row">
                <label class="kontrola-labela mb-0" for="select_duznosnik">Dužnosnik</label>
                <div class="duznosnici-ogranicenja-crud__duznosnik-wrap">
                    <!-- Vidljivost: sustav_varijable 1004 = 1 i id_korisnik u listi iz retka 1002; kliznik 0-Poruke.css -->
                    <div id="toggle_svi_duznosnik_wrap" class="duznosnici-ogranicenja-crud__svi-toggle-wrap" hidden>
                        <label class="poruke__toggle-label" for="toggle_svi_duznosnik">
                            <input type="checkbox" id="toggle_svi_duznosnik" class="poruke__toggle-input" autocomplete="off" disabled aria-label="Svi dužnosnici uključujući Mastera">
                            <span class="poruke__toggle-slider" aria-hidden="true"></span>
                            <span class="poruke__toggle-text">Svi</span>
                        </label>
                    </div>
                    <div class="kontrola-select">
                        <select id="select_duznosnik" aria-label="Odaberi dužnosnika">
                            <option value="">— Odaberi dužnosnika —</option>
                        </select>
                    </div>
                    <button type="button" id="btn_reload_tablica" class="duznosnici-ogranicenja-crud__reload-btn" aria-label="Ponovno punjenje tablice" title="Puni tablicu"><span class="kontrola-icon--arrow-path" aria-hidden="true"></span></button>
                </div>
            </div>
            <!-- Blok: Red zaglavlja – Država -->
            <div class="duznosnici-ogranicenja-crud__header-row">
                <label class="kontrola-labela mb-0" for="edit_drzava">Država</label>
                <div class="duznosnici-ogranicenja-crud__edit-with-ellipsis">
                    <input id="edit_drzava" type="text" class="kontrola-edit" readonly placeholder="" aria-label="Država">
                    <button type="button" id="btn_izbor_drzave" class="duznosnici-ogranicenja-crud__ellipsis-btn" aria-label="Izbor države" title="Izbor države"><span class="kontrola-icon--ellipsis-horizontal" aria-hidden="true"></span></button>
                </div>
            </div>
            <!-- Blok: Red zaglavlja – Regija -->
            <div class="duznosnici-ogranicenja-crud__header-row">
                <label class="kontrola-labela mb-0" for="edit_regija">Regija</label>
                <div class="duznosnici-ogranicenja-crud__edit-with-ellipsis">
                    <input id="edit_regija" type="text" class="kontrola-edit" readonly placeholder="" aria-label="Regija">
                    <button type="button" id="btn_izbor_regije" class="duznosnici-ogranicenja-crud__ellipsis-btn" aria-label="Izbor regija" title="Izbor regija"><span class="kontrola-icon--ellipsis-horizontal" aria-hidden="true"></span></button>
                </div>
            </div>
            <!-- Blok: Red zaglavlja – Loža -->
            <div class="duznosnici-ogranicenja-crud__header-row">
                <label class="kontrola-labela mb-0" for="edit_loza">Loža</label>
                <div class="duznosnici-ogranicenja-crud__edit-with-ellipsis">
                    <input id="edit_loza" type="text" class="kontrola-edit" readonly placeholder="" aria-label="Loža">
                    <button type="button" id="btn_izbor_loze" class="duznosnici-ogranicenja-crud__ellipsis-btn" aria-label="Izbor loža" title="Izbor loža"><span class="kontrola-icon--ellipsis-horizontal" aria-hidden="true"></span></button>
                </div>
            </div>
        </div>
        <div class="kontrola-panel__body">
            <div id="tablicaContainer" class="kontrola-tablica"></div>
        </div>
    </div>
    <!-- Blok: Drugi panel – stupnjevi po obredu + CRUD u podnožju -->
    <div class="kontrola-panel-tablica kontrola-panel-tablica--has-header kontrola-panel-tablica--has-header-one-row kontrola-panel-tablica--has-footer kontrola-panel kontrola-panel--resize-y mb-3 duznosnici-ogranicenja-crud__panel-stupnjevi-po-obredu" data-resize-max-vh="none">
        <div class="kontrola-panel__header duznosnici-ogranicenja-crud__stupnjevi-po-obredu-header">
            <h3 class="duznosnici-ogranicenja-crud__stupnjevi-po-obredu-title">Prikaz stupnjeva po obredu</h3>
        </div>
        <div class="kontrola-panel__body">
            <div id="tablicaContainerStupnjeviPoObredu" class="kontrola-tablica"></div>
        </div>
        <div class="kontrola-panel__footer duznosnici-ogranicenja-crud__tablica-footer">
            <div class="duznosnici-ogranicenja-crud__footer-left">
                <button type="button" id="btnUpisi" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upis</span></span></span></button>
                <button type="button" id="btnIzbrisi" class="kontrola-btn kontrola-btn--crud-izbrisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Izbriši</span></span></span></button>
            </div>
            <div class="duznosnici-ogranicenja-crud__footer-center">
                <button type="button" id="btnSveOgranicenja" class="kontrola-btn duznosnici-ogranicenja-crud__btn-sve" hidden><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Sve</span></span></span></button>
            </div>
            <div class="duznosnici-ogranicenja-crud__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
            </div>
        </div>
    </div>
</div>
<script src="../js/00-Version.js?v=1.0.241"></script>
<script src="../js/0-Kontrole.js?v=1.0.241"></script>
<script src="../js/0-Common.js?v=1.0.241"></script>
<script src="../js/0-Razine.js?v=1.0.241"></script>
<script src="../js/0-Poruke.js?v=1.0.241"></script>
<script src="../js/0-Poruke_Tekstovi.js?v=1.0.241"></script>
<script src="../js/Duznosnici_Ogranicenja_CRUD.js?v=1.0.241"></script>
</body>
</html>
