<!DOCTYPE html>
<!--
  Kandidat_Dokumenti_CRUD.html – dokumentacija kandidata (životopis) po loži.
  Gornji red: lijevo panel slike (foto člana, SAMO PRIKAZ – dvoklik isključen, bez obrade),
  desno panel tablice (logo lože + Država/Regija/Loža + Traži) s popisom kandidata (kandidat=1).
  Ispod: edit panel s tab kontrolom (zasad 1 tab „Životopis") + CRUD podnožje.
  Uzor: Clanovi_Loza_CRUD (layout/geo/tablica), Esej_CRUD (tab kontrola).
-->
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Dokumenti kandidata</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../slike/VNLH_Favicon.png?v=1.0.242" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../css/0-Common.css?v=1.0.242">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=1.0.242">
    <link rel="stylesheet" href="../css/0-Obrada_Slike.css?v=1.0.242">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=1.0.242">
    <link rel="stylesheet" href="../css/0-Kontrole_Tab.css?v=1.0.242">
    <link rel="stylesheet" href="../css/Clanovi_CRUD.css?v=1.0.242">
    <link rel="stylesheet" href="../css/Clanovi_Loza_CRUD.css?v=1.0.242">
    <link rel="stylesheet" href="../css/Kandidat_Dokumenti_CRUD.css?v=1.0.242">
</head>
<body class="vnlh-page-kandidat-dokumenti-crud">
<div class="naslov-forme"><h2>Dokumentacija kandidata</h2></div>
<div class="page-container clanovi-loza-crud kandidat-dokumenti-crud">
    <div class="clanovi-crud__top-row clanovi-loza-crud__top-row">
        <!-- Lijevo: slika člana – samo prikaz (bez dvoklika/obrade/brisanja). -->
        <div class="kontrola-panel mb-3 clanovi-crud__panel-slika kandidat-dokumenti-crud__panel-slika">
            <div class="kontrola-panel__body">
                <div class="clanovi-crud__edit-image-area kandidat-dokumenti-crud__image-area" id="kandidat_image_area" aria-label="Slika kandidata (samo prikaz)">
                    <div id="kandidat_image_frame" class="obrada-slika__preview-wrap clanovi-crud__panel-preview-wrap" data-placeholder="nema slike">
                        <img id="kandidat_image_preview" class="obrada-slika__img" src="" alt="" aria-hidden="true" style="display: none;" draggable="false">
                    </div>
                </div>
            </div>
        </div>
        <!-- Desno: zaglavlje (logo + geo + traži) + tablica kandidata. -->
        <div class="kontrola-panel-tablica kontrola-panel-tablica--has-header kontrola-panel-tablica--has-header-four-rows kontrola-panel kontrola-panel--resize-y mb-3 clanovi-crud__panel-tablica clanovi-loza-crud__panel-tablica">
            <div class="kontrola-panel__header clanovi-crud__tablica-header clanovi-loza-crud__tablica-header">
                <div class="clanovi-loza-crud__tablica-header-logo-wrap" aria-hidden="true">
                    <div class="clanovi-loza-crud__tablica-header-logo-frame">
                        <img id="kandidat_loza_logo" class="clanovi-loza-crud__tablica-header-logo-img" alt="" decoding="async" hidden src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                    </div>
                </div>
                <div class="clanovi-loza-crud__tablica-header-kontrole">
                    <label class="kontrola-labela mb-0" for="select_drzava">Država</label>
                    <div class="clanovi-loza-crud__drzava-select-reload">
                        <div class="kontrola-select clanovi-loza-crud__header-select-drzava">
                            <select id="select_drzava" aria-label="Odaberi državu">
                                <option value="">— Odaberi državu —</option>
                            </select>
                        </div>
                    </div>
                    <label class="kontrola-labela mb-0" for="select_regija">Regija</label>
                    <div class="kontrola-select">
                        <select id="select_regija" aria-label="Odaberi regiju" disabled>
                            <option value="">— Odaberi regiju —</option>
                        </select>
                    </div>
                    <label class="kontrola-labela mb-0" for="select_loza">Loža</label>
                    <div class="kontrola-select">
                        <select id="select_loza" aria-label="Odaberi ložu" disabled>
                            <option value="">— Odaberi ložu —</option>
                        </select>
                    </div>
                    <div class="clanovi-loza-crud__header-kontrole__trazi">
                        <div class="kontrola-edit-delete clanovi-loza-crud__trazi-edit-delete">
                            <span class="clanovi-loza-crud__trazi-lupe" aria-hidden="true"><span class="kontrola-icon--magnifying-glass"></span></span>
                            <input id="kandidat_dok_trazi" type="text" class="kontrola-edit-delete__input" autocomplete="off" aria-label="Filtriraj redove u tablici">
                            <button type="button" class="kontrola-edit-delete__clear" aria-label="Očisti traženje" title="Očisti"><span class="kontrola-icon--x-mark" aria-hidden="true"></span></button>
                        </div>
                        <button type="button" id="btn_reload_tablica" class="clanovi-crud__reload-btn clanovi-loza-crud__reload-btn" aria-label="Ponovno punjenje tablice" title="Puni tablicu"><span class="kontrola-icon--arrow-path" aria-hidden="true"></span></button>
                    </div>
                </div>
            </div>
            <div class="kontrola-panel__body">
                <div id="tablicaContainer" class="kontrola-tablica"></div>
            </div>
        </div>
    </div>

    <!-- Edit panel: tab kontrola (1 tab „Životopis") + CRUD podnožje. Bez zaglavlja. -->
    <div class="kontrola-panel mb-3" id="edit_panel">
        <div class="kontrola-panel__body kandidat-dokumenti-crud__edit-body">
            <div class="kontrola-tab kandidat-dokumenti-crud__tab" id="kandidatKontrolaTab" role="tablist" aria-label="Kartice dokumentacije kandidata">
                <div class="kontrola-tab__traka" role="presentation">
                    <button type="button" class="kontrola-tab__kartica kontrola-tab__kartica--aktivna" role="tab" id="kandidatKontrolaTabKart0" aria-selected="true" aria-controls="kandidatKontrolaTabPanel0" data-tab-index="0" disabled>Životopis</button>
                    <button type="button" class="kontrola-tab__kartica" role="tab" id="kandidatKontrolaTabKart1" aria-selected="false" aria-controls="kandidatKontrolaTabPanel1" data-tab-index="1" tabindex="-1" disabled>Razgovori</button>
                    <button type="button" class="kontrola-tab__kartica" role="tab" id="kandidatKontrolaTabKart2" aria-selected="false" aria-controls="kandidatKontrolaTabPanel2" data-tab-index="2" tabindex="-1" disabled>Obrazac 001a</button>
                </div>
                <div class="kontrola-tab__tijelo" role="presentation">
                    <div class="kontrola-tab__panel kontrola-tab__panel--aktivna kandidat-dokumenti-crud__tab-panel--zivotopis" role="tabpanel" id="kandidatKontrolaTabPanel0" aria-labelledby="kandidatKontrolaTabKart0">
                        <div class="kandidat-dokumenti-crud__zivotopis-blok" role="group" aria-label="Životopis kandidata">
                            <div class="kandidat-dokumenti-crud__zivotopis-red">
                                <div class="kandidat-dokumenti-crud__scrol-omot">
                                    <div id="kandidat_zivotopis" class="kontrola-napomena kandidat-dokumenti-crud__zivotopis-kontrola" contenteditable="false" role="textbox" aria-multiline="true" aria-label="Životopis" spellcheck="true"></div>
                                </div>
                                <div class="kandidat-dokumenti-crud__zivotopis-akcije">
                                    <button type="button" id="kandidat_btn_pdf" class="kandidat-dokumenti-crud__pdf-btn" disabled aria-label="Generiraj PDF životopisa" title="Generiraj PDF">
                                        <svg class="kandidat-dokumenti-crud__pdf-icon" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                                                  fill="none" stroke="currentColor" stroke-width="1.5"
                                                  stroke-linecap="round" stroke-linejoin="round"/>
                                            <polyline points="14 2 14 8 20 8" fill="none" stroke="currentColor"
                                                      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                            <rect x="5" y="14" width="14" height="6" rx="1" fill="currentColor"/>
                                            <text x="12" y="18.4" font-family="Arial, sans-serif" font-size="3.8"
                                                  font-weight="bold" fill="white" text-anchor="middle">PDF</text>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Tab 1: Razgovori (1:N) — tablica zapisa + ikone Dodaj/Izmijeni (modal). -->
                    <div class="kontrola-tab__panel kandidat-dokumenti-crud__tab-panel--razgovori" role="tabpanel" id="kandidatKontrolaTabPanel1" aria-labelledby="kandidatKontrolaTabKart1" hidden>
                        <div class="kandidat-dokumenti-crud__razgovori">
                            <div class="kandidat-dokumenti-crud__razgovori-glavni">
                                <div class="kandidat-dokumenti-crud__razgovori-tablica">
                                    <div id="razgovoriTablicaContainer" class="kontrola-tablica"></div>
                                </div>
                                <div class="kandidat-dokumenti-crud__razgovori-pdf">
                                    <button type="button" id="razgovorPdf" class="kandidat-dokumenti-crud__pdf-btn" disabled aria-label="Generiraj PDF razgovora" title="Generiraj PDF">
                                        <svg class="kandidat-dokumenti-crud__pdf-icon" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                            <polyline points="14 2 14 8 20 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                            <rect x="5" y="14" width="14" height="6" rx="1" fill="currentColor"/>
                                            <text x="12" y="18.4" font-family="Arial, sans-serif" font-size="3.8" font-weight="bold" fill="white" text-anchor="middle">PDF</text>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class="kandidat-dokumenti-crud__razgovori-akcije" role="group" aria-label="Radnje nad razgovorima">
                                <button type="button" id="razgovorDodaj" class="kandidat-dokumenti-crud__razgovor-akcija" title="Dodaj razgovor" aria-label="Dodaj razgovor"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 4h18v2.5H3V4zm0 5.75h10v2.5H3v-2.5z"/><path d="M16 13h2.5v3.5H22V19h-3.5v3.5H16V19h-3.5v-2.5H16V13z"/></svg></button>
                                <button type="button" id="razgovorUredi" class="kandidat-dokumenti-crud__razgovor-akcija" disabled title="Izmijeni razgovor" aria-label="Izmijeni razgovor"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5h18v2H3V5zm0 4h12v2H3V9zm0 4h8v2H3v-2zm0 4h8v2H3v-2z"/><path d="M21.41 11.59l-2-2a1.5 1.5 0 0 0-2.12 0l-5.79 5.79V19h3.62l5.79-5.79a1.5 1.5 0 0 0 0-2.12l.5.5zm-7.29 5.41h-1v-1l4.79-4.79 1 1L14.12 17z"/></svg></button>
                                <button type="button" id="razgovorObrisi" class="kandidat-dokumenti-crud__razgovor-akcija" disabled title="Obriši razgovor" aria-label="Obriši razgovor"><span class="kontrola-icon--trash" aria-hidden="true"></span></button>
                                <button type="button" id="razgovorDeselekt" class="kandidat-dokumenti-crud__razgovor-akcija" disabled title="Makni selekciju" aria-label="Makni selekciju"><span class="kontrola-icon--asterisk" aria-hidden="true"></span></button>
                            </div>
                        </div>
                    </div>
                    <!-- Tab 2: Obrazac 001a (1:1) — grupirana polja u tri kolone; ①② samo prikaz (RO iz kandidata). -->
                    <div class="kontrola-tab__panel kandidat-dokumenti-crud__tab-panel--obrazac" role="tabpanel" id="kandidatKontrolaTabPanel2" aria-labelledby="kandidatKontrolaTabKart2" hidden>
                        <div class="kandidat-dokumenti-crud__obrazac">
                            <!-- Zaglavlje obrasca: Status | Datum dokumenta | PDF (desno) + linija preko sve tri kolone -->
                            <div class="kandidat-dokumenti-crud__obrazac-zaglavlje">
                                <div class="kandidat-dokumenti-crud__polje kandidat-dokumenti-crud__polje--redak">
                                    <label class="kontrola-labela mb-0" for="obr_status_pristupa">Status</label>
                                    <div class="kontrola-select">
                                        <select id="obr_status_pristupa" aria-label="Status: Iniciran, Reguliran ili Pridružen">
                                            <option value="">— Odaberi —</option>
                                            <option value="Iniciran">Iniciran</option>
                                            <option value="Reguliran">Reguliran</option>
                                            <option value="Pridružen">Pridružen</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="kandidat-dokumenti-crud__polje kandidat-dokumenti-crud__polje--redak">
                                    <label class="kontrola-labela mb-0" for="obr_datum_dokumenta">Datum dokumenta</label>
                                    <input id="obr_datum_dokumenta" type="date" class="kontrola-edit">
                                </div>
                                <div class="kandidat-dokumenti-crud__obrazac-zaglavlje-pdf">
                                    <button type="button" id="obr_pdf" class="kandidat-dokumenti-crud__pdf-btn" disabled aria-label="Generiraj PDF Obrasca 001a" title="Generiraj PDF">
                                        <svg class="kandidat-dokumenti-crud__pdf-icon" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                            <polyline points="14 2 14 8 20 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                            <rect x="5" y="14" width="14" height="6" rx="1" fill="currentColor"/>
                                            <text x="12" y="18.4" font-family="Arial, sans-serif" font-size="3.8" font-weight="bold" fill="white" text-anchor="middle">PDF</text>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <!-- Stupčani raspored (bez naslova): 3 kolone, svaki red 1–2 polja. ①② RO iz kandidata. -->
                            <div class="kandidat-dokumenti-crud__obrazac-stupci">
                                <!-- 1. kolona -->
                                <div class="kandidat-dokumenti-crud__obrazac-stupac">
                                    <div class="kandidat-dokumenti-crud__obrazac-red">
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_ro_ime_prezime">Prezime i ime</label>
                                            <input id="obr_ro_ime_prezime" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                                        </div>
                                    </div>
                                    <div class="kandidat-dokumenti-crud__obrazac-red">
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_ro_spol">Spol</label>
                                            <input id="obr_ro_spol" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                                        </div>
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_ro_oib">OIB</label>
                                            <input id="obr_ro_oib" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                                        </div>
                                    </div>
                                    <div class="kandidat-dokumenti-crud__obrazac-red">
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_ro_datum_rodjenja">Datum rođenja</label>
                                            <input id="obr_ro_datum_rodjenja" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                                        </div>
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_mjesto_rodjenja">Mjesto rođenja</label>
                                            <input id="obr_mjesto_rodjenja" type="text" class="kontrola-edit" maxlength="100" autocomplete="off">
                                        </div>
                                    </div>
                                    <div class="kandidat-dokumenti-crud__obrazac-red">
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_drzava_rodjenja">Država rođenja</label>
                                            <input id="obr_drzava_rodjenja" type="text" class="kontrola-edit" maxlength="100" autocomplete="off">
                                        </div>
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_drzavljanstvo">Državljanstvo</label>
                                            <input id="obr_drzavljanstvo" type="text" class="kontrola-edit" maxlength="100" autocomplete="off">
                                        </div>
                                    </div>
                                    <!-- Masonske poveznice (checkbox = Da) — u 1. koloni, ispod Država rođenja -->
                                    <div class="kandidat-dokumenti-crud__obrazac-grupa kandidat-dokumenti-crud__obrazac-grupa--u-stupcu">
                                        <div class="kandidat-dokumenti-crud__obrazac-naslov">Masonske poveznice</div>
                                        <div class="kandidat-dokumenti-crud__obrazac-mreza">
                                            <div class="kandidat-dokumenti-crud__polje kandidat-dokumenti-crud__polje--check">
                                                <span class="clanovi-crud__checkbox-row">
                                                    <input type="checkbox" id="obr_dijete_masona" class="kontrola-checkbox" value="1" aria-label="Dijete masona">
                                                    <label class="kontrola-labela mb-0" for="obr_dijete_masona">Dijete masona</label>
                                                </span>
                                            </div>
                                            <div class="kandidat-dokumenti-crud__polje kandidat-dokumenti-crud__polje--check">
                                                <span class="clanovi-crud__checkbox-row">
                                                    <input type="checkbox" id="obr_veza_masoni" class="kontrola-checkbox" value="1" aria-label="Druge poveznice s masonima">
                                                    <label class="kontrola-labela mb-0" for="obr_veza_masoni">Druge poveznice s masonima</label>
                                                </span>
                                            </div>
                                            <div class="kandidat-dokumenti-crud__polje kandidat-dokumenti-crud__polje--check">
                                                <span class="clanovi-crud__checkbox-row">
                                                    <input type="checkbox" id="obr_zahtjev_druga_loza" class="kontrola-checkbox" value="1" aria-label="Zahtjev drugoj loži ili obedijenciji">
                                                    <label class="kontrola-labela mb-0" for="obr_zahtjev_druga_loza">Zahtjev drugoj Loži / Obedijenciji</label>
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- 2. kolona (RO Boravište; Ulica dvoredna: adresa_1 + adresa_2) -->
                                <div class="kandidat-dokumenti-crud__obrazac-stupac">
                                    <div class="kandidat-dokumenti-crud__obrazac-red">
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_ro_ulica">Ulica</label>
                                            <input id="obr_ro_ulica" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                                        </div>
                                    </div>
                                    <div class="kandidat-dokumenti-crud__obrazac-red">
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_ro_ulica2">Ulica</label>
                                            <input id="obr_ro_ulica2" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                                        </div>
                                    </div>
                                    <div class="kandidat-dokumenti-crud__obrazac-red">
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_ro_grad">Grad</label>
                                            <input id="obr_ro_grad" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                                        </div>
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_ro_posta">Poštanski broj</label>
                                            <input id="obr_ro_posta" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                                        </div>
                                    </div>
                                    <div class="kandidat-dokumenti-crud__obrazac-red">
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_ro_drzava">Država</label>
                                            <input id="obr_ro_drzava" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                                        </div>
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_ro_telefon">Telefon</label>
                                            <input id="obr_ro_telefon" type="text" class="kontrola-edit kontrola-edit--readonly" readonly tabindex="-1" aria-readonly="true">
                                        </div>
                                    </div>
                                </div>
                                <!-- 3. kolona -->
                                <div class="kandidat-dokumenti-crud__obrazac-stupac">
                                    <div class="kandidat-dokumenti-crud__obrazac-red">
                                        <div class="kandidat-dokumenti-crud__polje">
                                            <label class="kontrola-labela mb-0" for="obr_zvanje">Zvanje</label>
                                            <input id="obr_zvanje" type="text" class="kontrola-edit" maxlength="100" autocomplete="off">
                                        </div>
