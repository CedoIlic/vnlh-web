<!DOCTYPE html>
<!--
  Kandidat_Dokumenti_CRUD.html – dokumentacija kandidata (životopis) po loži.
  Gornji red: lijevo panel slike (foto člana, SAMO PRIKAZ – dvoklik isključen, bez obrade),
  desno panel tablice (logo lože + Država/Regija/Loža + Traži) s popisom kandidata (kandidat=1).
  Ispod: edit panel s tab kontrolom (zasad 1 tab „Životopis") + CRUD podnožje.
  Uzor: Clanovi_Loza_CRUD (layout/geo/tablica), Esej_CRUD (tab kontrola).
-->
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Dokumenti kandidata</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../slike/VNLH_Favicon.png?v=__VNLH_ASSET_V__" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../css/0-Common.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Obrada_Slike.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Kontrole_Tab.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/Clanovi_CRUD.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/Clanovi_Loza_CRUD.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/Kandidat_Dokumenti_CRUD.css?v=__VNLH_ASSET_V__">
</head>
<body class="vnlh-page-kandidat-dokumenti-crud">
<div class="naslov-forme"><h2>Dokumentacija kandidata</h2></div>
<div class="page-container clanovi-loza-crud kandidat-dokumenti-crud">
    <div class="clanovi-crud__top-row clanovi-loza-crud__top-row">
        <!-- Lijevo: slika člana – samo prikaz (bez dvoklika/obrade/brisanja). -->
        <div class="kontrola-panel mb-3 clanovi-crud__panel-slika kandidat-dokumenti-crud__panel-slika">
            <div class="kontrola-panel__body">
                <div class="clanovi-crud__edit-image-area kandidat-dokumenti-crud__image-area" id="kandidat_image_area" aria-label="Slika kandidata (samo prikaz)">
                    <div id="kandidat_image_frame" class="obrada-slika__preview-wrap clanovi-crud__panel-preview-wrap" data-placeholder="nema slike">
                        <img id="kandidat_image_preview" class="obrada-slika__img" src="" alt="" aria-hidden="true" style="display: none;" draggable="false">
                    </div>
                </div>
            </div>
        </div>
        <!-- Desno: zaglavlje (logo + geo + traži) + tablica kandidata. -->
        <div class="kontrola-panel-tablica kontrola-panel-tablica--has-header kontrola-panel-tablica--has-header-four-rows kontrola-panel kontrola-panel--resize-y mb-3 clanovi-crud__panel-tablica clanovi-loza-crud__panel-tablica">
            <div class="kontrola-panel__header clanovi-crud__tablica-header clanovi-loza-crud__tablica-header">
                <div class="clanovi-loza-crud__tablica-header-logo-wrap" aria-hidden="true">
                    <div class="clanovi-loza-crud__tablica-header-logo-frame">
                        <img id="kandidat_loza_logo" class="clanovi-loza-crud__tablica-header-logo-img" alt="" decoding="async" hidden src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                    </div>
                </div>
                <div class="clanovi-loza-crud__tablica-header-kontrole">
                    <label class="kontrola-labela mb-0" for="select_drzava">Država</label>
                    <div class="clanovi-loza-crud__drzava-select-reload">
                        <div class="kontrola-select clanovi-loza-crud__header-select-drzava">
                            <select id="select_drzava" aria-label="Odaberi državu">
                                <option value="">— Odaberi državu —</option>
                            </select>
                        </div>
                        <button type="button" id="btn_reload_tablica" class="clanovi-crud__reload-btn clanovi-loza-crud__reload-btn" aria-label="Ponovno punjenje tablice" title="Puni tablicu"><span class="kontrola-icon--arrow-path" aria-hidden="true"></span></button>
                    </div>
                    <label class="kontrola-labela mb-0" for="select_regija">Regija</label>
                    <div class="kontrola-select">
                        <select id="select_regija" aria-label="Odaberi regiju" disabled>
                            <option value="">— Odaberi regiju —</option>
                        </select>
                    </div>
                    <label class="kontrola-labela mb-0" for="select_loza">Loža</label>
                    <div class="kontrola-select">
                        <select id="select_loza" aria-label="Odaberi ložu" disabled>
                            <option value="">— Odaberi ložu —</option>
                        </select>
                    </div>
                    <div class="clanovi-loza-crud__header-kontrole__trazi">
                        <div class="kontrola-edit-delete clanovi-loza-crud__trazi-edit-delete">
                            <span class="clanovi-loza-crud__trazi-lupe" aria-hidden="true"><span class="kontrola-icon--magnifying-glass"></span></span>
                            <input id="kandidat_dok_trazi" type="text" class="kontrola-edit-delete__input" autocomplete="off" aria-label="Filtriraj redove u tablici">
                            <button type="button" class="kontrola-edit-delete__clear" aria-label="Očisti traženje" title="Očisti"><span class="kontrola-icon--x-mark" aria-hidden="true"></span></button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="kontrola-panel__body">
                <div id="tablicaContainer" class="kontrola-tablica"></div>
            </div>
        </div>
    </div>

    <!-- Edit panel: tab kontrola (1 tab „Životopis") + CRUD podnožje. Bez zaglavlja. -->
    <div class="kontrola-panel mb-3" id="edit_panel">
        <div class="kontrola-panel__body kandidat-dokumenti-crud__edit-body">
            <div class="kontrola-tab kandidat-dokumenti-crud__tab" id="kandidatKontrolaTab" role="tablist" aria-label="Kartice dokumentacije kandidata">
                <div class="kontrola-tab__traka" role="presentation">
                    <button type="button" class="kontrola-tab__kartica kontrola-tab__kartica--aktivna" role="tab" id="kandidatKontrolaTabKart0" aria-selected="true" aria-controls="kandidatKontrolaTabPanel0" data-tab-index="0" disabled>Životopis</button>
                </div>
                <div class="kontrola-tab__tijelo" role="presentation">
                    <div class="kontrola-tab__panel kontrola-tab__panel--aktivna kandidat-dokumenti-crud__tab-panel--zivotopis" role="tabpanel" id="kandidatKontrolaTabPanel0" aria-labelledby="kandidatKontrolaTabKart0">
                        <div class="kandidat-dokumenti-crud__zivotopis-blok" role="group" aria-label="Životopis kandidata">
                            <div class="kandidat-dokumenti-crud__scrol-omot">
                                <div id="kandidat_zivotopis" class="kontrola-napomena kandidat-dokumenti-crud__zivotopis-kontrola" contenteditable="false" role="textbox" aria-multiline="true" aria-label="Životopis" spellcheck="true"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="kontrola-panel__footer clanovi-crud__edit-footer">
            <div class="clanovi-crud__footer-left">
                <button type="button" id="btnUpisi" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upis</span></span></span></button>
                <button type="button" id="btnIzbrisi" class="kontrola-btn kontrola-btn--crud-izbrisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Izbriši</span></span></span></button>
            </div>
            <div class="clanovi-crud__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
            </div>
        </div>
    </div>
</div>
<script src="../js/00-Version.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Kontrole.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Common.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke_Tekstovi.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Kontrole_Tab.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Filteri_Po_Ogranicenjima.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/Kandidat_Dokumenti_CRUD.js?v=__VNLH_ASSET_V__"></script>
</body>
</html>
