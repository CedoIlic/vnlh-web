<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Postavke zastavica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="../slike/VNLH_Favicon.png?v=__VNLH_ASSET_V__" type="image/png" sizes="32x32">
<link rel="stylesheet" href="../css/0-Common.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/00-Testni_modal.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/Clanovi_Zastavice_CRUD.css?v=__VNLH_ASSET_V__">
</head>
<body>
<div class="naslov-forme"><h2>Postavke zastavica</h2></div>
<div class="page-container">
    <div class="kontrola-panel-tablica kontrola-panel kontrola-panel--resize-y mb-3">
        <div class="kontrola-panel__body">
            <div id="tablicaContainer" class="kontrola-tablica"></div>
        </div>
    </div>
    <div class="kontrola-panel mb-3" id="edit_panel">
        <div class="kontrola-panel__body clanovi-zastavice-crud__edit-body">
            <div class="clanovi-zastavice-crud__edit-row clanovi-zastavice-crud__edit-row--naziv-id-boja">
                <div class="clanovi-zastavice-crud__cell clanovi-zastavice-crud__cell--id">
                    <label class="kontrola-labela mb-0" for="id_edit">ID</label>
                    <input id="id_edit" type="text" class="kontrola-edit clanovi-zastavice-crud__id-edit" inputmode="numeric" placeholder="1–16" maxlength="2" aria-label="ID (1–16)">
                </div>
                <div class="clanovi-zastavice-crud__cell clanovi-zastavice-crud__cell--naziv">
                    <label class="kontrola-labela mb-0" for="naziv_edit">Naziv zastavice</label>
                    <div class="kontrola-edit-delete">
                        <input id="naziv_edit" type="text" class="kontrola-edit-delete__input" placeholder="Naziv zastavice...">
                        <button type="button" class="kontrola-edit-delete__clear" aria-label="Obriši sadržaj">×</button>
                    </div>
                </div>
                <div class="clanovi-zastavice-crud__edit-row__boja-wrap">
                    <div class="clanovi-zastavice-crud__cell clanovi-zastavice-crud__cell--boja">
                        <label class="kontrola-labela mb-0" for="boja_display">Boja</label>
                        <input id="boja_display" type="text" class="kontrola-edit clanovi-zastavice-crud__boja-display" readonly aria-label="Odabrana boja">
                    </div>
                    <div class="clanovi-zastavice-crud__cell clanovi-zastavice-crud__cell--icon">
                        <button type="button" id="boja_picker_btn" class="clanovi-zastavice-crud__boja-icon-btn" aria-label="Odaberi boju">
                            <svg class="clanovi-zastavice-crud__boja-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.53 16.122a3 3 0 0 0-5.78 1.128 2.25 2.25 0 0 1-2.4 2.245 4.5 4.5 0 0 0 8.4-2.245c0-.399-.078-.78-.22-1.128zm0 0a15.998 15.998 0 0 0 3.388-1.62m-5.043-.025a15.994 15.994 0 0 1 1.622-3.395m3.38 3.39a15.995 15.995 0 0 0 4.769-4.769 3.39 3.39 0 0 0-3.39-3.39 15.995 15.995 0 0 0-4.77 4.77 3.39 3.39 0 0 0 3.39 3.39z"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="clanovi-zastavice-crud__edit-row">
                <label class="kontrola-labela mb-0" for="opis_edit">Opis svrhe zastavice</label>
                <textarea id="opis_edit" class="kontrola-napomena clanovi-zastavice-crud__opis" rows="2" placeholder="Opis..." maxlength="1024"></textarea>
            </div>
            <div class="clanovi-zastavice-crud__edit-row clanovi-zastavice-crud__edit-row--checkbox">
                <label class="kontrola-labela clanovi-zastavice-crud__label-checkbox">
                    <input id="aktivnost_edit" type="checkbox" class="kontrola-checkbox" aria-label="Aktivnost">
                    <span class="clanovi-zastavice-crud__checkbox-text">Aktivnost</span>
                </label>
            </div>
        </div>
        <div class="kontrola-panel__footer clanovi-zastavice-crud__edit-footer">
            <div class="clanovi-zastavice-crud__footer-left">
                <button type="button" id="btnUpisi" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upis</span></span></span></button>
                <button type="button" id="btnIzbrisi" class="kontrola-btn kontrola-btn--crud-izbrisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Izbriši</span></span></span></button>
            </div>
            <div class="clanovi-zastavice-crud__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
            </div>
        </div>
    </div>
</div>
<!-- Skriveni color+alpha picker (otvara se klikom na ikonu) -->
<div id="boja_picker_modal" class="clanovi-zastavice-crud__picker-modal" role="dialog" aria-label="Odabir boje" aria-modal="true" hidden>
    <div class="clanovi-zastavice-crud__picker-backdrop"></div>
    <div class="clanovi-zastavice-crud__picker-box">
        <p class="clanovi-zastavice-crud__picker-label">Boja</p>
        <input type="color" id="boja_picker_color" value="#000000" class="clanovi-zastavice-crud__picker-color">
        <p class="clanovi-zastavice-crud__picker-label">Prozirnost</p>
        <input type="range" id="boja_picker_alpha" min="0" max="255" value="255" class="clanovi-zastavice-crud__picker-alpha">
        <p class="clanovi-zastavice-crud__picker-label">Pregled</p>
        <div id="boja_picker_preview" class="clanovi-zastavice-crud__picker-preview" aria-hidden="true"></div>
        <p class="clanovi-zastavice-crud__picker-hex" id="boja_picker_hex"></p>
        <div class="clanovi-zastavice-crud__picker-actions">
            <button type="button" id="boja_picker_ok" class="kontrola-btn" autofocus><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">U redu</span></span></span></button>
            <button type="button" id="boja_picker_cancel" class="kontrola-btn"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Odustani</span></span></span></button>
        </div>
    </div>
</div>
<script src="../js/00-Version.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Kontrole.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Common.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/00-Testni_modal.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke_Tekstovi.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/Clanovi_Zastavice_CRUD.js?v=__VNLH_ASSET_V__"></script>
</body>
</html>
