<!-- =========================================================
     0-Poruke.html
     Modal „Poruke”: lijevo toggle + tablica pošiljatelja (GET 0-Poruke_lista.php), desno povijest (scroll) + textarea,
     zaglavlje s refreshom, podnožje Povratak + nativni resize.
     Učitava ga js/0-Poruke.js preko fetch('0-Poruke.php'); __ID_PREFIX__ → jedinstveni id prefiks (npr. vnlh_modal_poruke).
     ========================================================= -->
<div id="__ID_PREFIX__" class="testni-modal kontrola-modal--dim" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="__ID_PREFIX___header">
    <div class="kontrola-modal__overlay"></div>
    <div class="testni-modal__dialog">
        <div class="kontrola-modal__header testni-modal__header poruke__header" id="__ID_PREFIX___header">
            <div class="poruke__header-title">Poruke</div>
            <button type="button" id="__ID_PREFIX___refresh" class="poruke__refresh-btn" aria-label="Osvježi poruke" title="Osvježi poruke">
                <svg class="poruke__refresh-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.992 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182M2.985 19.644l3.181-3.182"/></svg>
            </button>
        </div>
        <div class="kontrola-modal__body testni-modal__body">
            <!-- Lijevo: tablica pošiljatelja (stilovi iz 0-Poruke.css). -->
            <div class="poruke__left">
                <div class="poruke__toggle-row">
                    <label class="poruke__toggle-label" id="__ID_PREFIX___toggle_label">
                        <input type="checkbox" id="__ID_PREFIX___toggle" class="poruke__toggle-input" aria-label="Filtar poruka">
                        <span class="poruke__toggle-slider"></span>
                        <span class="poruke__toggle-text" id="__ID_PREFIX___toggle_text">Sve poruke</span>
                    </label>
                </div>
                <div class="poruke__tablica-wrap" id="__ID_PREFIX___tablica_wrap">
                    <table class="poruke__tablica" id="__ID_PREFIX___tablica">
                        <tbody id="__ID_PREFIX___tbody"></tbody>
                    </table>
                </div>
            </div>
            <!-- Desno: na PC-u povijest iznad poruke (70/30); na mobitelu CSS order – poruka ispod tablice, povijest dolje. -->
            <div class="testni-modal__desno">
                <!--
                  Napomene: puna širina stupca; na širokom ekranu visina 70% / 30% (povijest / poruka).
                  Povijest: #…_edit_povijest = .poruke__napomena-scroll (isti CSS tokeni/boje kao modal Poruke).
                -->
                <div class="testni-modal__napomene">
                    <div class="testni-modal__napomena-blok testni-modal__napomena-blok--povijest">
                        <div class="poruke__napomena-div testni-modal__povijest-okvir">
                            <div id="__ID_PREFIX___edit_povijest" class="poruke__napomena-scroll testni-modal__edit-povijest" aria-live="polite" aria-label="Povijest razgovora"></div>
                        </div>
                    </div>
                    <!-- Red: polje poruke + ikona Pošalji (stil tipke kao .poruke__posalji-btn u 0-Poruke.css). -->
                    <div class="testni-modal__napomena-blok testni-modal__napomena-blok--poruka">
                        <div class="testni-modal__poruka-row">
                            <textarea id="__ID_PREFIX___edit_poruka" class="testni-modal__napomena testni-modal__edit-poruka" spellcheck="true" aria-label="Poruka" rows="1" disabled></textarea>
                            <button type="button" id="__ID_PREFIX___posalji" class="poruke__posalji-btn" aria-label="Pošalji" title="Pošalji" disabled>
                                <svg class="poruke__posalji-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Podnožje: lijevo + i trash, desno Povratak (stilovi .poruke__footer* u 0-Poruke.css). -->
        <div class="kontrola-modal__footer poruke__footer testni-modal__footer">
            <div class="poruke__footer-left">
                <button type="button" id="__ID_PREFIX___nova" class="poruke__icon-btn" aria-label="Nova poruka" title="Nova poruka">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                </button>
                <button type="button" id="__ID_PREFIX___brisi" class="poruke__icon-btn" aria-label="Obriši razgovor" title="Obriši razgovor" disabled>
                    <span class="poruke-icon--trash" aria-hidden="true"></span>
                </button>
            </div>
            <div class="poruke__footer-right">
                <button type="button" id="__ID_PREFIX___povratak" class="poruke-btn poruke-btn--povratak" title="Zatvori">
                    <span class="poruke-btn__outer"><span class="poruke-btn__inner"><span class="poruke-btn__label">Povratak</span></span></span>
                </button>
            </div>
            <!-- Mobitel: kut dijaloga kroz podnožje; povlačenje mijenja širinu/visinu .testni-modal__dialog (vidi 0-Poruke.js initTestniMobileDialogResizeHandle). -->
            <div id="__ID_PREFIX___dialog_resize" class="testni-modal__footer-resize-corner" aria-label="Promijeni veličinu prozora poruka" title="Veličina prozora">
                <svg class="testni-modal__footer-resize-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
            </div>
        </div>
        <!-- Popup za + (pozicioniran unutar .testni-modal__dialog). -->
        <div id="__ID_PREFIX___popup_korisnici" class="poruke__popup" style="display:none">
            <input type="text" id="__ID_PREFIX___popup_filter" class="poruke__popup-filter" aria-label="Pretraži korisnika" autocomplete="off" />
            <div id="__ID_PREFIX___popup_lista" class="poruke__popup-lista"></div>
        </div>
    </div>
</div>
