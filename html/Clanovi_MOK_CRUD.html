<!DOCTYPE html>
<!--
  Clanovi_MOK_CRUD.html – MOK (osobni karton člana): kratke bilješke koje o članu upisuju nadređeni.
  Gornji red: lijevo slika člana (SAMO PRIKAZ), desno panel tablice (logo lože + Država/Regija/Loža + Traži)
  s popisom PUNIH članova odabrane lože (aktivnost=1, kandidat=0).
  Ispod: edit panel — pod-tablica bilješki + tekst bilješke + ikone (Nova / Izmijeni / Obriši / Deselekt).
  DISKRECIJA: čitaš samo svoje bilješke zapisane u loži u kojoj si i sada; kontrolna razina (sustav_varijable 127)
  čita sve, ali ne mijenja i ne briše. Rok izmjene/brisanja u mjesecima je u sustav_varijable 128.
  Uzor: Kandidat_Dokumenti_CRUD (layout/geo/slika/pod-tablica).
-->
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>MOK</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../slike/VNLH_Favicon.png?v=1.0.247" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../css/0-Common.css?v=1.0.247">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=1.0.247">
    <link rel="stylesheet" href="../css/0-Obrada_Slike.css?v=1.0.247">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=1.0.247">
    <link rel="stylesheet" href="../css/Clanovi_CRUD.css?v=1.0.247">
    <link rel="stylesheet" href="../css/Clanovi_Loza_CRUD.css?v=1.0.247">
    <link rel="stylesheet" href="../css/Esej_CRUD.css?v=1.0.247">
    <link rel="stylesheet" href="../css/Clanovi_MOK_CRUD.css?v=1.0.247">
</head>
<body class="vnlh-page-clanovi-mok-crud">
<div class="naslov-forme"><h2>MOK</h2></div>
<div class="page-container clanovi-loza-crud clanovi-mok-crud">
    <div class="clanovi-crud__top-row clanovi-loza-crud__top-row">
        <!-- Lijevo: slika člana – samo prikaz (bez dvoklika/obrade/brisanja). -->
        <div class="kontrola-panel mb-3 clanovi-crud__panel-slika clanovi-mok-crud__panel-slika">
            <div class="kontrola-panel__body">
                <div class="clanovi-crud__edit-image-area clanovi-mok-crud__image-area" id="mok_image_area" aria-label="Slika člana (samo prikaz)">
                    <div id="mok_image_frame" class="obrada-slika__preview-wrap clanovi-crud__panel-preview-wrap" data-placeholder="nema slike">
                        <img id="mok_image_preview" class="obrada-slika__img" src="" alt="" aria-hidden="true" style="display: none;" draggable="false">
                    </div>
                </div>
            </div>
        </div>
        <!-- Desno: zaglavlje (logo + geo + traži) + tablica članova. -->
        <div class="kontrola-panel-tablica kontrola-panel-tablica--has-header kontrola-panel-tablica--has-header-four-rows kontrola-panel kontrola-panel--resize-y mb-3 clanovi-crud__panel-tablica clanovi-loza-crud__panel-tablica">
            <div class="kontrola-panel__header clanovi-crud__tablica-header clanovi-loza-crud__tablica-header">
                <div class="clanovi-loza-crud__tablica-header-logo-wrap" aria-hidden="true">
                    <div class="clanovi-loza-crud__tablica-header-logo-frame">
                        <img id="mok_loza_logo" class="clanovi-loza-crud__tablica-header-logo-img" alt="" decoding="async" hidden src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                    </div>
                </div>
                <div class="clanovi-loza-crud__tablica-header-kontrole">
                    <label class="kontrola-labela mb-0" for="select_drzava">Država</label>
                    <div class="clanovi-loza-crud__drzava-select-reload">
                        <div class="kontrola-select clanovi-loza-crud__header-select-drzava">
                            <select id="select_drzava" aria-label="Odaberi državu">
                                <option value="">— Odaberi državu —</option>
                            </select>
                        </div>
                    </div>
                    <label class="kontrola-labela mb-0" for="select_regija">Regija</label>
                    <div class="kontrola-select">
                        <select id="select_regija" aria-label="Odaberi regiju" disabled>
                            <option value="">— Odaberi regiju —</option>
                        </select>
                    </div>
                    <label class="kontrola-labela mb-0" for="select_loza">Loža</label>
                    <div class="kontrola-select">
                        <select id="select_loza" aria-label="Odaberi ložu" disabled>
                            <option value="">— Odaberi ložu —</option>
                        </select>
                    </div>
                    <div class="clanovi-loza-crud__header-kontrole__trazi">
                        <div class="kontrola-edit-delete clanovi-loza-crud__trazi-edit-delete">
                            <span class="clanovi-loza-crud__trazi-lupe" aria-hidden="true"><span class="kontrola-icon--magnifying-glass"></span></span>
                            <input id="mok_trazi" type="text" class="kontrola-edit-delete__input" autocomplete="off" aria-label="Filtriraj redove u tablici">
                            <button type="button" class="kontrola-edit-delete__clear" aria-label="Očisti traženje" title="Očisti"><span class="kontrola-icon--x-mark" aria-hidden="true"></span></button>
                        </div>
                        <button type="button" id="btn_reload_tablica" class="clanovi-crud__reload-btn clanovi-loza-crud__reload-btn" aria-label="Ponovno punjenje tablice" title="Puni tablicu"><span class="kontrola-icon--arrow-path" aria-hidden="true"></span></button>
                    </div>
                </div>
            </div>
            <div class="kontrola-panel__body">
                <div id="tablicaContainer" class="kontrola-tablica"></div>
            </div>
        </div>
    </div>

    <!-- Edit panel: bilješke odabranog člana (pod-tablica + tekst) + CRUD podnožje. -->
    <div class="kontrola-panel mb-3" id="edit_panel">
        <div class="kontrola-panel__body clanovi-mok-crud__edit-body">
            <div class="clanovi-mok-crud__biljeske">
                <div class="clanovi-mok-crud__biljeske-lijevo">
                    <div class="clanovi-mok-crud__biljeske-tablica">
                        <div id="mokTablicaContainer" class="kontrola-tablica"></div>
                    </div>
                    <div class="clanovi-mok-crud__biljeske-akcije" role="group" aria-label="Radnje nad bilješkama">
                        <button type="button" id="mokNova" class="clanovi-mok-crud__akcija" disabled title="Nova bilješka" aria-label="Nova bilješka"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 4h18v2.5H3V4zm0 5.75h10v2.5H3v-2.5z"/><path d="M16 13h2.5v3.5H22V19h-3.5v3.5H16V19h-3.5v-2.5H16V13z"/></svg></button>
                        <button type="button" id="mokUredi" class="clanovi-mok-crud__akcija" disabled title="Izmijeni bilješku" aria-label="Izmijeni bilješku"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5h18v2H3V5zm0 4h12v2H3V9zm0 4h8v2H3v-2zm0 4h8v2H3v-2z"/><path d="M21.41 11.59l-2-2a1.5 1.5 0 0 0-2.12 0l-5.79 5.79V19h3.62l5.79-5.79a1.5 1.5 0 0 0 0-2.12l.5.5zm-7.29 5.41h-1v-1l4.79-4.79 1 1L14.12 17z"/></svg></button>
                        <button type="button" id="mokObrisi" class="clanovi-mok-crud__akcija" disabled title="Obriši bilješku" aria-label="Obriši bilješku"><span class="kontrola-icon--trash" aria-hidden="true"></span></button>
                        <button type="button" id="mokDeselekt" class="clanovi-mok-crud__akcija" disabled title="Makni selekciju" aria-label="Makni selekciju"><span class="kontrola-icon--asterisk" aria-hidden="true"></span></button>
                    </div>
                </div>
                <!-- Desno: PRIKAZ selektirane bilješke (uređivanje ide kroz modal).
                     Zaglavlje: „datum, autor" bold → dužnost autora bold → linija → tekst. -->
                <div class="clanovi-mok-crud__biljeske-desno">
                    <div class="clanovi-mok-crud__scrol-omot">
                        <div class="clanovi-mok-crud__prikaz" id="mok_prikaz">
                            <div class="clanovi-mok-crud__prikaz-zaglavlje" id="mok_prikaz_zaglavlje" hidden>
                                <div class="clanovi-mok-crud__prikaz-red" id="mok_prikaz_datum_autor"></div>
                                <div class="clanovi-mok-crud__prikaz-red" id="mok_prikaz_duznost"></div>
                            </div>
                            <div class="clanovi-mok-crud__prikaz-linija" id="mok_prikaz_linija" hidden aria-hidden="true"></div>
                            <div class="clanovi-mok-crud__prikaz-tekst" id="mok_prikaz_tekst" role="region" aria-label="Tekst bilješke"></div>
                        </div>
                    </div>
                    <div class="clanovi-mok-crud__status" id="mok_status" aria-live="polite"></div>
                </div>
            </div>
        </div>
        <div class="kontrola-panel__footer clanovi-crud__edit-footer">
            <div class="clanovi-crud__footer-left"></div>
            <div class="clanovi-crud__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
            </div>
        </div>
    </div>
</div>
<!-- Modal: unos / izmjena bilješke (premještanje po zaglavlju, resize kut; pozicija i veličina se pamte) -->
<div id="mokModal" class="clanovi-mok-crud__modal" role="dialog" aria-label="Bilješka" aria-modal="true" aria-hidden="true">
    <div class="clanovi-mok-crud__modal-overlay"></div>
    <div class="clanovi-mok-crud__modal-dialog">
        <div class="clanovi-mok-crud__modal-header" id="mokModalNaslov">Nova bilješka</div>
        <div class="clanovi-mok-crud__modal-body">
            <textarea id="mok_modal_tekst" class="kontrola-napomena clanovi-mok-crud__modal-tekst" spellcheck="true" aria-label="Tekst bilješke"></textarea>
        </div>
        <div class="clanovi-mok-crud__modal-footer">
            <div class="clanovi-crud__footer-left">
                <button type="button" id="mokModalUpisi" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upiši</span></span></span></button>
            </div>
            <div class="clanovi-crud__footer-right">
                <button type="button" id="mokModalOdustani" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Odustani</span></span></span></button>
            </div>
        </div>
        <div class="clanovi-mok-crud__modal-resize" id="mokModalResizeKut" title="Povuci za promjenu veličine" aria-hidden="true">
            <svg class="clanovi-mok-crud__modal-resize-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M22 14 14 22M22 19 19 22"/></svg>
        </div>
    </div>
</div>
<script src="../js/00-Version.js?v=1.0.247"></script>
<script src="../js/0-Kontrole.js?v=1.0.247"></script>
<script src="../js/0-Common.js?v=1.0.247"></script>
<script src="../js/0-Poruke.js?v=1.0.247"></script>
<script src="../js/0-Poruke_Tekstovi.js?v=1.0.247"></script>
<script src="../js/0-Filteri_Po_Ogranicenjima.js?v=1.0.247"></script>
<script src="../js/Clanovi_MOK_CRUD.js?v=1.0.247"></script>
</body>
</html>
