     Radovi_TipUnosaPrisutnih_CRUD.html
     CRUD radovi_prisustvo_tip: tablica R., Naziv, Boja, Svi, S., D.; edit + picker boje; čekboxovi.
     ========================================================= -->
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Tipovi unosa prisustva</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../slike/VNLH_Favicon.png?v=__VNLH_ASSET_V__" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../css/0-Common.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/Radovi_TipUnosaPrisutnih_CRUD.css?v=__VNLH_ASSET_V__">
</head>
<body>
<div class="naslov-forme"><h2>Tipovi unosa prisustva</h2></div>
<div class="page-container">
    <div class="kontrola-panel-tablica kontrola-panel kontrola-panel--resize-y mb-3">
        <div class="kontrola-panel__body">
            <div id="tablicaContainer" class="kontrola-tablica"></div>
        </div>
    </div>
    <div class="kontrola-panel mb-3" id="edit_panel">
        <div class="kontrola-panel__body radovi-tip-unosa-pris-crud__edit-body">
            <div class="radovi-tip-unosa-pris-crud__edit-inner" style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div class="radovi-tip-unosa-pris-crud__red-glava">
                    <div class="radovi-tip-unosa-pris-crud__polje naziv-polje">
                        <label class="kontrola-labela mb-0" for="edit_naziv">Naziv</label>
                        <div class="kontrola-edit-delete">
                            <input id="edit_naziv" type="text" class="kontrola-edit-delete__input" placeholder="Naziv tipa..." maxlength="50">
                            <button type="button" class="kontrola-edit-delete__clear" aria-label="Obriši sadržaj">×</button>
                        </div>
                    </div>
                    <div class="radovi-tip-unosa-pris-crud__polje redosljed-polje">
                        <label class="kontrola-labela mb-0" for="edit_redosljed">Redosljed</label>
                        <input id="edit_redosljed" type="text" class="kontrola-edit" inputmode="numeric" placeholder="1–99" aria-label="Redosljed 1 do 99" style="text-align: right;">
                    </div>
                    <div class="radovi-tip-unosa-pris-crud__boja-wrap">
                        <div class="radovi-tip-unosa-pris-crud__polje radovi-tip-unosa-pris-crud__polje--boja">
                            <label class="kontrola-labela mb-0" for="edit_boja_prikaza">Boja prikaza</label>
                            <input id="edit_boja_prikaza" type="text" class="kontrola-edit radovi-tip-unosa-pris-crud__boja-display" readonly aria-label="Boja prikaza (izbornik ili prazno)">
                        </div>
                        <button type="button" id="radovi_tip_pris_boja_picker_btn" class="radovi-tip-unosa-pris-crud__boja-icon-btn" aria-label="Odaberi boju prikaza" title="Paleta boje">
                            <svg class="radovi-tip-unosa-pris-crud__boja-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.53 16.122a3 3 0 0 0-5.78 1.128 2.25 2.25 0 0 1-2.4 2.245 4.5 4.5 0 0 0 8.4-2.245c0-.399-.078-.78-.22-1.128zm0 0a15.998 15.998 0 0 0 3.388-1.62m-5.043-.025a15.994 15.994 0 0 1 1.622-3.395m3.38 3.39a15.995 15.995 0 0 0 4.769-4.769 3.39 3.39 0 0 0-3.39-3.39 15.995 15.995 0 0 0-4.77 4.77 3.39 3.39 0 0 0 3.39 3.39z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="radovi-tip-unosa-pris-crud__duznosnik-red">
                    <input type="checkbox" id="edit_duznosnik_ok" class="kontrola-checkbox radovi-tip-unosa-pris-crud__duznosnik-cb" value="1" aria-label="Smije obnašati dužnost na radovima">
                    <label class="kontrola-labela mb-0 radovi-tip-unosa-pris-crud__duznosnik-label" for="edit_duznosnik_ok">Smije obnašati dužnost na radovima</label>
                    <input type="checkbox" id="edit_slobodan_unos" class="kontrola-checkbox radovi-tip-unosa-pris-crud__duznosnik-cb" value="1" aria-label="Slobodan unos imena, lože i države">
                    <label class="kontrola-labela mb-0 radovi-tip-unosa-pris-crud__duznosnik-label" for="edit_slobodan_unos">Slobodan unos imena, lože i države</label>
                    <input type="checkbox" id="edit_svi_clanovi_obedijncije" class="kontrola-checkbox radovi-tip-unosa-pris-crud__duznosnik-cb" value="1" aria-label="Svi članovi obedijencije u izvor">
                    <label class="kontrola-labela mb-0 radovi-tip-unosa-pris-crud__duznosnik-label" for="edit_svi_clanovi_obedijncije">Svi članovi obedijencije u izvor</label>
                </div>
            </div>
        </div>
        <div class="kontrola-panel__footer radovi-tip-unosa-pris-crud__edit-footer">
            <div class="radovi-tip-unosa-pris-crud__footer-left">
                <button type="button" id="btnUpisi" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upis</span></span></span></button>
                <button type="button" id="btnIzbrisi" class="kontrola-btn kontrola-btn--crud-izbrisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Izbriši</span></span></span></button>
            </div>
            <div class="radovi-tip-unosa-pris-crud__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
            </div>
        </div>
    </div>
</div>

<div id="radovi_tip_pris_boja_modal" class="radovi-tip-unosa-pris-picker__modal" role="dialog" aria-label="Odabir boje prikaza" aria-modal="true" hidden>
    <div class="radovi-tip-unosa-pris-picker__backdrop"></div>
    <div class="radovi-tip-unosa-pris-picker__box">
        <p class="radovi-tip-unosa-pris-picker__label">Boja</p>
        <input type="color" id="radovi_tip_pris_boja_picker_color" value="#000000" class="radovi-tip-unosa-pris-picker__color">
        <p class="radovi-tip-unosa-pris-picker__label">Prozirnost</p>
        <input type="range" id="radovi_tip_pris_boja_picker_alpha" min="0" max="255" value="255" class="radovi-tip-unosa-pris-picker__alpha">
        <p class="radovi-tip-unosa-pris-picker__label">Pregled</p>
        <div id="radovi_tip_pris_boja_picker_preview" class="radovi-tip-unosa-pris-picker__preview" aria-hidden="true"></div>
        <p class="radovi-tip-unosa-pris-picker__hex" id="radovi_tip_pris_boja_picker_hex"></p>
        <div class="radovi-tip-unosa-pris-picker__actions">
            <button type="button" id="radovi_tip_pris_boja_picker_ok" class="kontrola-btn" autofocus><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">U redu</span></span></span></button>
            <button type="button" id="radovi_tip_pris_boja_picker_cancel" class="kontrola-btn"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Odustani</span></span></span></button>
        </div>
    </div>
</div>

<script src="../js/00-Version.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Kontrole.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Common.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke_Tekstovi.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/Radovi_TipUnosaPrisutnih_CRUD.js?v=__VNLH_ASSET_V__"></script>
</body>
</html>
