<!DOCTYPE html>
<!--
  Regije_CRUD.html – forma za CRUD regija po državi.
  - Odabir države (select), tablica regija (id, naziv), jedna edit-delete kontrola (naziv).
  - Upis: nova regija za odabranu državu. Izmjena: naziv odabrane regije (država se ne mijenja).
  - Brisanje: odabrana regija. Povratak: referrer ili Meni.html.
  Ovisnosti: 0-Common.css, 0-Kontrole.css; 0-Kontrole.js, 0-Common.js, 0-Poruke_Tekstovi.js, Regije_CRUD.js.
  API: Regije_CRUD_sve.php (GET id_drzava), Regije_CRUD_upis.php, Regije_CRUD_izmjena.php, Regije_CRUD_brisanje.php; Drzave_CRUD_sve.php za select.
-->
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Regije</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="../slike/VNLH_Favicon.png?v=10.16.00" type="image/png" sizes="32x32">
<link rel="stylesheet" href="../css/0-Common.css?v=10.16.00">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=10.16.00">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=10.16.00">
    <link rel="stylesheet" href="../css/00-Testni_modal.css?v=10.16.01">
</head>
<body>
<div class="naslov-forme"><h2>Regije</h2></div>
<div class="page-container">
    <div class="kontrola-panel-tablica kontrola-panel-tablica--has-header kontrola-panel kontrola-panel--resize-y mb-3">
        <div class="kontrola-panel__header regije-crud__tablica-header" style="display: flex; align-items: center; gap: 0.75rem; min-width: 0;">
            <label class="kontrola-labela mb-0" for="select_drzava" style="white-space: nowrap; flex-shrink: 0;">Država</label>
            <div class="kontrola-select" style="flex: 1 1 auto; min-width: 0;">
                <select id="select_drzava" aria-label="Odaberi državu">
                    <option value="">— Odaberi državu —</option>
                </select>
            </div>
        </div>
        <div class="kontrola-panel__body">
            <div id="tablicaContainer" class="kontrola-tablica"></div>
        </div>
    </div>
    <div class="kontrola-panel mb-3" id="edit_panel">
        <div class="kontrola-panel__body regije-crud__edit-body">
            <div class="regije-crud__edit-row">
                <label class="kontrola-labela mb-0" for="edit_regija">Regija</label>
                <div class="kontrola-edit-delete">
                    <input id="edit_regija" type="text" class="kontrola-edit-delete__input" placeholder="Naziv regije...">
                    <button type="button" class="kontrola-edit-delete__clear" aria-label="Obriši sadržaj">×</button>
                </div>
            </div>
        </div>
        <div class="kontrola-panel__footer regije-crud__edit-footer">
            <div class="regije-crud__footer-left">
                <button type="button" id="btnUpisi" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upis</span></span></span></button>
                <button type="button" id="btnIzbrisi" class="kontrola-btn kontrola-btn--crud-izbrisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Izbriši</span></span></span></button>
            </div>
            <div class="regije-crud__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
            </div>
        </div>
    </div>
</div>
<script src="../js/00-Version.js?v=10.16.00"></script>
<script src="../js/0-Kontrole.js?v=10.16.00"></script>
<script src="../js/0-Common.js?v=10.16.00"></script>
<script src="../js/00-Testni_modal.js?v=10.16.00"></script>
<script src="../js/0-Poruke.js?v=10.16.00"></script>
<script src="../js/0-Poruke_Tekstovi.js?v=10.16.00"></script>
<script src="../js/Regije_CRUD.js?v=10.16.00"></script>
</body>
</html>
