<!-- =========================================================
     PDF_Dozvoljeni_izvori_dokumenata_CRUD.html
     CRUD pdf_dozvoljeni_izvori_dokumenata: panel tablica (uključene tablice) + edit panel.
     Selekt „Tablica" puni se tablicama koje imaju `id` i još nisu uključene.
     ========================================================= -->
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Dozvoljeni izvori dokumenata</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../slike/VNLH_Favicon.png?v=__VNLH_ASSET_V__" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../css/0-Common.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=__VNLH_ASSET_V__">
    <link rel="stylesheet" href="../css/PDF_Dozvoljeni_izvori_dokumenata_CRUD.css?v=__VNLH_ASSET_V__">
</head>
<body>
<div class="naslov-forme"><h2>Dozvoljeni izvori dokumenata</h2></div>
<div class="page-container pdf-izvdok-crud">

    <!-- Panel 1: tablica uključenih tablica -->
    <div class="kontrola-panel-tablica kontrola-panel kontrola-panel--resize-y mb-3 pdf-izvdok-crud__panel-tablica">
        <div class="kontrola-panel__body">
            <div id="tablicaContainer" class="kontrola-tablica"></div>
        </div>
    </div>

    <!-- Panel 2: edit -->
    <div class="kontrola-panel mb-3 pdf-izvdok-crud__panel-edit" id="edit_panel">
        <div class="kontrola-panel__body pdf-izvdok-crud__edit-body">

            <div class="pdf-izvdok-crud__mreza">
                <div class="pdf-izvdok-crud__polje">
                    <label class="kontrola-labela mb-0" for="edit_tablica">Tablica</label>
                    <div class="kontrola-select">
                        <select id="edit_tablica" aria-label="Tablica">
                            <option value="">— odaberi tablicu —</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="pdf-izvdok-crud__napomena-red">
                <label class="kontrola-labela mb-0" for="edit_napomena">Napomena</label>
                <textarea id="edit_napomena" class="kontrola-napomena" rows="2" placeholder="Slobodna bilješka..." maxlength="1024"></textarea>
            </div>
        </div>

        <div class="kontrola-panel__footer pdf-izvdok-crud__edit-footer">
            <div class="pdf-izvdok-crud__footer-left">
                <button type="button" id="btnUpisi" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upis</span></span></span></button>
                <button type="button" id="btnIzbrisi" class="kontrola-btn kontrola-btn--crud-izbrisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Izbriši</span></span></span></button>
            </div>
            <div class="pdf-izvdok-crud__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
            </div>
        </div>
    </div>

</div>


<script src="../js/00-Version.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Kontrole.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Common.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/0-Poruke_Tekstovi.js?v=__VNLH_ASSET_V__"></script>
<script src="../js/PDF_Dozvoljeni_izvori_dokumenata_CRUD.js?v=__VNLH_ASSET_V__"></script>
</body>
</html>
