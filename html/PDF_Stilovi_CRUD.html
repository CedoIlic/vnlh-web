<!-- =========================================================
     PDF_Stilovi_CRUD.html
     CRUD pdf_paragraf: tablica stilova + edit panel (tab kontrola:
     Font / Poravnanje i razmaci / Pozadina / Okvir) + preview panel.
     ========================================================= -->
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Stilovi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../slike/VNLH_Favicon.png?v=1.0.242" type="image/png" sizes="32x32">
    <link rel="stylesheet" href="../css/0-Common.css?v=1.0.242">
    <link rel="stylesheet" href="../css/0-Kontrole.css?v=1.0.242">
    <link rel="stylesheet" href="../css/0-Kontrole_Tab.css?v=1.0.242">
    <link rel="stylesheet" href="../css/0-Poruke.css?v=1.0.242">
    <link rel="stylesheet" href="../css/PDF_Stilovi_CRUD.css?v=1.0.242">
</head>
<body>
<div class="naslov-forme"><h2>Stilovi</h2></div>
<div class="page-container pdf-stilovi-crud">

    <div class="pdf-stilovi-crud__gornji-red">

    <!-- Panel 1: tablica postojećih stilova (lijevo) -->
    <div class="kontrola-panel-tablica kontrola-panel kontrola-panel--resize-y mb-3 pdf-stilovi-crud__panel-tablica" data-resize-sync-group="pdf-stilovi">
        <div class="kontrola-panel__body">
            <div id="tablicaContainer" class="kontrola-tablica"></div>
        </div>
    </div>

    <!-- Panel 2: edit (desno) — bez vlastite resize trake; visinu sinkronizira sync-group s tablicom -->
    <div class="kontrola-panel mb-3 pdf-stilovi-crud__panel-edit" id="edit_panel" data-resize-sync-group="pdf-stilovi">
        <div class="kontrola-panel__body pdf-stilovi-crud__edit-body">

            <!-- Naziv stila: uvijek vidljiv iznad tabova -->
            <div class="pdf-stilovi-crud__naziv-red">
                <div class="pdf-stilovi-crud__naziv-polje">
                    <label class="kontrola-labela mb-0" for="edit_naziv">Naziv stila</label>
                    <div class="kontrola-edit-delete pdf-stilovi-crud__naziv-kontrola">
                        <input id="edit_naziv" type="text" class="kontrola-edit-delete__input" placeholder="npr. Naslov1, Tijelo" maxlength="50" autocomplete="off">
                        <button type="button" class="kontrola-edit-delete__clear" aria-label="Obriši sadržaj">×</button>
                    </div>
                </div>
                <div class="pdf-stilovi-crud__naslijedi-polje" id="naslijediWrap" hidden>
                    <label class="kontrola-labela mb-0" for="edit_naslijedi">Nasljedi stil</label>
                    <div class="kontrola-select pdf-stilovi-crud__naslijedi">
                        <select id="edit_naslijedi" aria-label="Nasljedi stil">
                            <option value="">— odaberi —</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tab kontrola -->
            <div class="kontrola-tab pdf-stilovi-crud__tab" id="stiloviTab" role="tablist" aria-label="Postavke stila paragrafa">
                <div class="kontrola-tab__traka" role="presentation">
                    <button type="button" class="kontrola-tab__kartica kontrola-tab__kartica--aktivna" role="tab" id="stiloviTabKart0" aria-selected="true" aria-controls="stiloviTabPanel0" data-tab-index="0">Font</button>
                    <button type="button" class="kontrola-tab__kartica" role="tab" id="stiloviTabKart1" aria-selected="false" aria-controls="stiloviTabPanel1" data-tab-index="1" tabindex="-1">Poravnanje i razmaci</button>
                    <button type="button" class="kontrola-tab__kartica" role="tab" id="stiloviTabKart3" aria-selected="false" aria-controls="stiloviTabPanel3" data-tab-index="2" tabindex="-1">Okvir</button>
                </div>
                <div class="kontrola-tab__tijelo" role="presentation">

                    <!-- TAB 0: Font -->
                    <div class="kontrola-tab__panel" role="tabpanel" id="stiloviTabPanel0" aria-labelledby="stiloviTabKart0">
                        <div class="pdf-stilovi-crud__red">
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--font">
                                <label class="kontrola-labela mb-0" for="edit_font_id">Font</label>
                                <div class="kontrola-select">
                                    <select id="edit_font_id" aria-label="Font (aktivni iz registra)">
                                        <option value="">— Odaberi font —</option>
                                    </select>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--velicina">
                                <label class="kontrola-labela mb-0" for="edit_velicina_pt">Veličina (pt)</label>
                                <div class="pdf-stilovi-crud__stepper">
                                    <input id="edit_velicina_pt" type="text" class="kontrola-edit pdf-stilovi-crud__num pdf-stilovi-crud__stepper-input" inputmode="numeric" value="12" aria-label="Veličina slova u pt (cijeli broj)">
                                    <span class="pdf-stilovi-crud__stepper-strelice">
                                        <button type="button" id="velicina_pt_gore" class="pdf-stilovi-crud__stepper-btn" aria-label="Povećaj veličinu za 1" tabindex="-1">&#9650;</button>
                                        <button type="button" id="velicina_pt_dolje" class="pdf-stilovi-crud__stepper-btn" aria-label="Smanji veličinu za 1" tabindex="-1">&#9660;</button>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="pdf-stilovi-crud__red pdf-stilovi-crud__red--cekboxi">
                            <span class="pdf-stilovi-crud__cb">
                                <input type="checkbox" id="edit_bold" class="kontrola-checkbox" value="1" aria-label="Podebljano">
                                <label class="kontrola-labela mb-0" for="edit_bold">Podebljano</label>
                            </span>
                            <span class="pdf-stilovi-crud__cb">
                                <input type="checkbox" id="edit_italic" class="kontrola-checkbox" value="1" aria-label="Kurziv">
                                <label class="kontrola-labela mb-0" for="edit_italic">Kurziv</label>
                            </span>
                            <span class="pdf-stilovi-crud__cb">
                                <input type="checkbox" id="edit_podcrtano" class="kontrola-checkbox" value="1" aria-label="Podcrtano">
                                <label class="kontrola-labela mb-0" for="edit_podcrtano">Podcrtano</label>
                            </span>
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--boja pdf-stilovi-crud__polje--desno">
                                <label class="kontrola-labela mb-0" for="edit_boja">Boja teksta</label>
                                <div class="kontrola-boja" data-boja-za="edit_boja" data-boja-nullable="0">
                                    <button type="button" id="edit_boja_trigger" class="kontrola-boja__trigger" aria-label="Izaberi boju teksta">
                                        <span class="kontrola-icon--paleta" aria-hidden="true"></span>
                                    </button>
                                    <input id="edit_boja" type="text" class="kontrola-edit kontrola-edit--readonly kontrola-boja__hex" maxlength="9" tabindex="-1" aria-readonly="true" placeholder="#000000" readonly aria-label="Boja teksta (hex)">
                                    <span class="kontrola-boja__swatch" aria-hidden="true"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 1: Poravnanje i razmaci -->
                    <div class="kontrola-tab__panel" role="tabpanel" id="stiloviTabPanel1" aria-labelledby="stiloviTabKart1" hidden>
                        <div class="pdf-stilovi-crud__mreza-poravnanje">
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--poravnanje">
                                <label class="kontrola-labela mb-0" for="edit_poravnanje">Poravnanje</label>
                                <div class="kontrola-select">
                                    <select id="edit_poravnanje" aria-label="Poravnanje teksta">
                                        <option value="left">Lijevo</option>
                                        <option value="right">Desno</option>
                                        <option value="center">Sredina</option>
                                        <option value="justify">Obostrano</option>
                                    </select>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--prored">
                                <label class="kontrola-labela mb-0" for="edit_prored">Prored</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_prored" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="1" aria-label="Množitelj proreda">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">×</span>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje">
                                <label class="kontrola-labela mb-0" for="edit_razmak_prije_mm">Razmak prije</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_razmak_prije_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Razmak iznad paragrafa u mm">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje">
                                <label class="kontrola-labela mb-0" for="edit_razmak_poslije_mm">Razmak poslije</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_razmak_poslije_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Razmak ispod paragrafa u mm">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--uvlaka1">
                                <label class="kontrola-labela mb-0" for="edit_uvlaka_lijevo_mm">Uvlaka lijevo</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_uvlaka_lijevo_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Lijeva uvlaka u mm">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje">
                                <label class="kontrola-labela mb-0" for="edit_uvlaka_desno_mm">Uvlaka desno</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_uvlaka_desno_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Desna uvlaka u mm">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje">
                                <label class="kontrola-labela mb-0" for="edit_uvlaka_prvi_red_mm">Uvlaka 1. retka</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_uvlaka_prvi_red_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Uvlaka prvog retka u mm">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                </div>
                            </div>
                        </div>
                        <div class="pdf-stilovi-crud__sekcija-naslov">Pozadina retka</div>
                        <hr class="pdf-stilovi-crud__sekcija-linija">
                        <div id="pozadina_sekcija">
                            <div class="pdf-stilovi-crud__red">
                                <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--boja">
                                    <label class="kontrola-labela mb-0" for="edit_boja_pozadine">Boja pozadine</label>
                                    <div class="kontrola-boja" data-boja-za="edit_boja_pozadine" data-boja-nullable="1">
                                        <button type="button" id="edit_boja_pozadine_trigger" class="kontrola-boja__trigger" aria-label="Izaberi boju pozadine">
                                            <span class="kontrola-icon--paleta" aria-hidden="true"></span>
                                        </button>
                                        <input id="edit_boja_pozadine" type="text" class="kontrola-edit kontrola-edit--readonly kontrola-boja__hex" maxlength="9" tabindex="-1" aria-readonly="true" placeholder="(bez)" readonly aria-label="Boja pozadine (hex)">
                                        <span class="kontrola-boja__swatch" aria-hidden="true"></span>
                                    </div>
                                </div>
                                <span class="pdf-stilovi-crud__cb pdf-stilovi-crud__cb--desno">
                                    <input type="checkbox" id="edit_pozadina_popuni_razmak" class="kontrola-checkbox" value="1" aria-label="Popuni razmak pozadinom">
                                    <label class="kontrola-labela mb-0" for="edit_pozadina_popuni_razmak">Popuni razmak pozadinom</label>
                                </span>
                                <span class="pdf-stilovi-crud__cb">
                                    <input type="checkbox" id="edit_pozadina_cijeli_red" class="kontrola-checkbox" value="1" aria-label="Preko cijelog retka">
                                    <label class="kontrola-labela mb-0" for="edit_pozadina_cijeli_red">Preko cijelog retka</label>
                                </span>
                            </div>
                            <div class="pdf-stilovi-crud__red pdf-stilovi-crud__red--strane pdf-stilovi-crud__red--razmaknuto">
                                <span class="pdf-stilovi-crud__strane-naslov pdf-stilovi-crud__strane-naslov--lijevo">Padding pozadine retka</span>
                                <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--mini">
                                    <label class="kontrola-labela mb-0" for="edit_traka_padding_gore_mm">Gore</label>
                                    <div class="pdf-stilovi-crud__unos-mjera">
                                        <input id="edit_traka_padding_gore_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Padding trake gore u mm">
                                        <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                    </div>
                                </div>
                                <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--mini">
                                    <label class="kontrola-labela mb-0" for="edit_traka_padding_dolje_mm">Dolje</label>
                                    <div class="pdf-stilovi-crud__unos-mjera">
                                        <input id="edit_traka_padding_dolje_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Padding trake dolje u mm">
                                        <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                    </div>
                                </div>
                                <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--mini">
                                    <label class="kontrola-labela mb-0" for="edit_traka_padding_lijevo_mm">Lijevo</label>
                                    <div class="pdf-stilovi-crud__unos-mjera">
                                        <input id="edit_traka_padding_lijevo_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Padding trake lijevo u mm">
                                        <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                    </div>
                                </div>
                                <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--mini">
                                    <label class="kontrola-labela mb-0" for="edit_traka_padding_desno_mm">Desno</label>
                                    <div class="pdf-stilovi-crud__unos-mjera">
                                        <input id="edit_traka_padding_desno_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Padding trake desno u mm">
                                        <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <p class="pdf-stilovi-crud__hint" id="pozadina_okvir_hint" hidden>Okvir je aktivan — podloga okvira preuzima pozadinu (ova polja se ignoriraju).</p>
                    </div>

                    <!-- TAB 2: Okvir -->
                    <div class="kontrola-tab__panel" role="tabpanel" id="stiloviTabPanel3" aria-labelledby="stiloviTabKart3" hidden>
                        <div class="pdf-stilovi-crud__mreza-okvir">
                            <span class="pdf-stilovi-crud__strane-naslov pdf-stilovi-crud__strane-naslov--lijevo">Debljina linije (0-bez)</span>
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--mini">
                                <label class="kontrola-labela mb-0" for="edit_okvir_debljina_gore_mm">Gore</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_okvir_debljina_gore_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Debljina gornje linije okvira u mm">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--mini">
                                <label class="kontrola-labela mb-0" for="edit_okvir_debljina_dolje_mm">Dolje</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_okvir_debljina_dolje_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Debljina donje linije okvira u mm">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--mini">
                                <label class="kontrola-labela mb-0" for="edit_okvir_debljina_lijevo_mm">Lijevo</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_okvir_debljina_lijevo_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Debljina lijeve linije okvira u mm">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--mini">
                                <label class="kontrola-labela mb-0" for="edit_okvir_debljina_desno_mm">Desno</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_okvir_debljina_desno_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Debljina desne linije okvira u mm">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                </div>
                            </div>
                            <span class="pdf-stilovi-crud__strane-naslov pdf-stilovi-crud__strane-naslov--lijevo">Padding okvira</span>
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--mini">
                                <label class="kontrola-labela mb-0" for="edit_okvir_padding_gore_mm">Gore</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_okvir_padding_gore_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Padding okvira gore u mm">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--mini">
                                <label class="kontrola-labela mb-0" for="edit_okvir_padding_dolje_mm">Dolje</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_okvir_padding_dolje_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Padding okvira dolje u mm">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--mini">
                                <label class="kontrola-labela mb-0" for="edit_okvir_padding_lijevo_mm">Lijevo</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_okvir_padding_lijevo_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Padding okvira lijevo u mm">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--mini">
                                <label class="kontrola-labela mb-0" for="edit_okvir_padding_desno_mm">Desno</label>
                                <div class="pdf-stilovi-crud__unos-mjera">
                                    <input id="edit_okvir_padding_desno_mm" type="text" class="kontrola-edit pdf-stilovi-crud__num" inputmode="decimal" value="0" aria-label="Padding okvira desno u mm">
                                    <span class="pdf-stilovi-crud__mjera" aria-hidden="true">mm</span>
                                </div>
                            </div>
                        </div>
                        <div class="pdf-stilovi-crud__okvir-cekboxi">
                            <span class="pdf-stilovi-crud__cb pdf-stilovi-crud__okvir-cb--lijevo">
                                <input type="checkbox" id="edit_okvir_do_lijeve_margine" class="kontrola-checkbox" value="1" aria-label="Okvir do lijeve margine">
                                <label class="kontrola-labela mb-0" for="edit_okvir_do_lijeve_margine">Do lijeve margine</label>
                            </span>
                            <span class="pdf-stilovi-crud__cb pdf-stilovi-crud__okvir-cb--sredina">
                                <input type="checkbox" id="edit_okvir_postuj_uvlaku" class="kontrola-checkbox" value="1" aria-label="Poštuj uvlaku">
                                <label class="kontrola-labela mb-0" for="edit_okvir_postuj_uvlaku">Poštuj uvlaku</label>
                            </span>
                            <span class="pdf-stilovi-crud__cb pdf-stilovi-crud__okvir-cb--desno">
                                <input type="checkbox" id="edit_okvir_do_desne_margine" class="kontrola-checkbox" value="1" aria-label="Okvir do desne margine">
                                <label class="kontrola-labela mb-0" for="edit_okvir_do_desne_margine">Do desne margine</label>
                            </span>
                        </div>
                        <div class="pdf-stilovi-crud__red pdf-stilovi-crud__red--razmaknuto">
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--boja pdf-stilovi-crud__polje--boja-red">
                                <label class="kontrola-labela mb-0" for="edit_okvir_boja">Boja okvira</label>
                                <div class="kontrola-boja" data-boja-za="edit_okvir_boja" data-boja-nullable="0">
                                    <button type="button" id="edit_okvir_boja_trigger" class="kontrola-boja__trigger" aria-label="Izaberi boju okvira">
                                        <span class="kontrola-icon--paleta" aria-hidden="true"></span>
                                    </button>
                                    <input id="edit_okvir_boja" type="text" class="kontrola-edit kontrola-edit--readonly kontrola-boja__hex" maxlength="9" tabindex="-1" aria-readonly="true" placeholder="#000000" readonly aria-label="Boja okvira (hex)">
                                    <span class="kontrola-boja__swatch" aria-hidden="true"></span>
                                </div>
                            </div>
                            <div class="pdf-stilovi-crud__polje pdf-stilovi-crud__polje--boja pdf-stilovi-crud__polje--boja-red">
                                <label class="kontrola-labela mb-0" for="edit_okvir_boja_podloge">Boja podloge</label>
                                <div class="kontrola-boja" data-boja-za="edit_okvir_boja_podloge" data-boja-nullable="1">
                                    <button type="button" id="edit_okvir_boja_podloge_trigger" class="kontrola-boja__trigger" aria-label="Izaberi boju podloge okvira">
                                        <span class="kontrola-icon--paleta" aria-hidden="true"></span>
                                    </button>
                                    <input id="edit_okvir_boja_podloge" type="text" class="kontrola-edit kontrola-edit--readonly kontrola-boja__hex" maxlength="9" tabindex="-1" aria-readonly="true" placeholder="(bez)" readonly aria-label="Boja podloge okvira (hex)">
                                    <span class="kontrola-boja__swatch" aria-hidden="true"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Napomena: uvijek vidljiva dolje -->
            <div class="pdf-stilovi-crud__napomena-red">
                <label class="kontrola-labela mb-0" for="edit_napomena">Napomena</label>
                <textarea id="edit_napomena" class="kontrola-napomena" rows="2" placeholder="Slobodna bilješka..." maxlength="1024"></textarea>
            </div>
        </div>

        <div class="kontrola-panel__footer pdf-stilovi-crud__edit-footer">
            <div class="pdf-stilovi-crud__footer-left">
                <button type="button" id="btnUpisi" class="kontrola-btn kontrola-btn--crud-upisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Upis</span></span></span></button>
                <button type="button" id="btnIzbrisi" class="kontrola-btn kontrola-btn--crud-izbrisi"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Izbriši</span></span></span></button>
            </div>
            <div class="pdf-stilovi-crud__footer-right">
                <button type="button" id="btnPovratak" class="kontrola-btn kontrola-btn--crud-povratak"><span class="kontrola-btn__outer"><span class="kontrola-btn__inner"><span class="kontrola-btn__label">Povratak</span></span></span></button>
            </div>
        </div>
    </div>

    </div><!-- /gornji-red -->

    <!-- Panel 3: preview (pdfmake — korak 4) — ispod, puna širina -->
    <div class="kontrola-panel kontrola-panel--resize-y mb-3 pdf-stilovi-crud__preview-panel">
        <div class="kontrola-panel__header pdf-stilovi-crud__preview-header">
            <span>Pregled</span>
            <button type="button" id="stiloviPreviewToggle" class="pdf-stilovi-crud__preview-toggle" aria-label="Prikaži jedan redak" title="Jedan redak / više redaka">
                <span class="kontrola-icon--vise-redaka" aria-hidden="true"></span>
            </button>
        </div>
        <div class="kontrola-panel__body pdf-stilovi-crud__preview-body">
            <div id="stiloviPreview" class="pdf-stilovi-crud__preview" aria-label="Pregled stila paragrafa">
                <div id="stiloviPreviewSadrzaj" class="pdf-stilovi-crud__preview-sadrzaj"></div>
                <div id="stiloviPreviewSpiner" class="kontrola-spiner-overlay" aria-hidden="true">
                    <span class="kontrola-spiner kontrola-spiner--segment" role="status" aria-label="Učitavanje"></span>
                </div>
            </div>
        </div>
    </div>

</div>
